<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polygon Card Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171C; --bg2:#1D2229; --panel:#232932; --sleeve:#F4EFE4; --page:#FBF7EE;
  --ink:#F1EFE9; --ink-soft:#B9C2CC; --muted:#8892A0; --line:#3A4453;
  /* Wordle-palet: groen (correct), geel (bijna), zwart (basis) + grijs/wit als subtiele basiskleuren */
  --green:#5DA352; --green-soft:#7FC26F; --yellow:#C9B458; --yellow-soft:#DFCB7C;
  --wblack:#15181D; --grey:#8B93A0; --grey-soft:#AEB6C0; --white:#F3F1E9;
  --amber:var(--green); --amber-soft:var(--green-soft);
  --gold:#C99A1E; --cat:#2FA79E;
  --facet:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  --facet-sm:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font:400 17px/1.6 var(--body);min-height:100vh;
  background:
    radial-gradient(ellipse 90% 60% at 50% -10%,rgba(93,163,82,.16),transparent 60%),
    radial-gradient(ellipse 70% 50% at 90% 110%,rgba(201,180,88,.12),transparent 60%),
    linear-gradient(180deg,rgba(20,23,28,.95),rgba(20,23,28,.99)),
    var(--bg);
  background-attachment:fixed;
  position:relative;
}
/* Gradiënt van kleine bolletjes: dicht bovenaan, vervaagt naar onder toe */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(93,163,82,.55) 1.6px,transparent 1.9px),
    radial-gradient(circle,rgba(201,180,88,.5) 1.6px,transparent 1.9px),
    radial-gradient(circle,rgba(243,241,233,.22) 1.4px,transparent 1.7px);
  background-size:54px 54px,74px 74px,34px 34px;
  background-position:0 0,27px 37px,12px 18px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.15) 80%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.15) 80%,transparent 100%);
}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.08;margin:0 0 10px;color:#fff}
h1{font-size:clamp(32px,5.6vw,54px)}
h2{font-size:clamp(24px,3.6vw,38px)}
button,input,textarea{font:inherit}
a{color:var(--amber-soft)}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px 56px}
.wrap.wide{max-width:min(1560px,96vw);padding:22px 24px 64px}
.col{max-width:720px}
.hint{color:var(--ink-soft);margin:0 0 22px;max-width:72ch;font-size:1.05em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* Knoppen en formulieren */
.btn{background:var(--amber);color:#12160f;border:0;clip-path:var(--facet-sm);padding:18px 24px;font:700 17.5px var(--body);min-height:56px;cursor:pointer;width:100%;transition:transform .15s ease, background .15s ease}
.btn:hover:not(:disabled){background:var(--amber-soft);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;padding:10px 6px;font-size:16px}
.link:hover{color:var(--amber-soft)}
.form{display:grid;gap:18px;margin:24px 0 8px}
.form label{display:grid;gap:7px;font-weight:600;font-size:16px;color:var(--ink-soft)}
.form input,.form textarea{border:1px solid var(--line);background:var(--panel);color:var(--ink);clip-path:var(--facet-sm);padding:14px;min-height:54px;font-weight:400;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;line-height:1.5;resize:vertical}
.form input{font-family:var(--body)}
.form input:focus,.form textarea:focus{background:#2C3541}
.msg{margin:0;min-height:1.5em;font-size:16px}
.msg.err,.err{color:#F0897E}
.msg.ok{color:var(--green-soft)}

/* Wordle-tegels */
.tile{width:clamp(50px,15vw,70px);aspect-ratio:1;display:grid;place-items:center;clip-path:var(--facet-sm);color:#fff;font:800 clamp(26px,8vw,38px)/1 var(--display)}
.t-g{background:var(--green)} .t-y{background:var(--yellow)} .t-x{background:var(--grey)}
.tilerow,.hero{display:flex;gap:6px;justify-content:center}
.hero{margin:20px 0 24px;justify-content:flex-start}
.tile.t-pending{background:var(--grey)}
.tile.flip{animation:flip .55s ease-in-out both;animation-delay:calc(var(--i) * .28s)}
@keyframes flip{
  0%{transform:rotateX(0)}
  49%{transform:rotateX(90deg);background:var(--grey)}
  51%{transform:rotateX(90deg);background:var(--final)}
  100%{transform:rotateX(0);background:var(--final)}
}

/* Kopregel en tabs */
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 22px;gap:12px;flex-wrap:wrap}
.brand{font:800 26px var(--display);color:#fff;display:flex;align-items:baseline;gap:8px}
.brand em{font-style:normal;color:var(--amber-soft)}
.topright{display:flex;gap:12px;align-items:center}
.coinpill{display:flex;align-items:center;gap:6px;background:var(--wblack);border:1px solid var(--line);color:var(--yellow-soft);font:700 15px var(--body);padding:9px 16px;clip-path:var(--facet-sm);white-space:nowrap}
.avbtn{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background-color:var(--panel);background-size:cover;background-position:center;color:#fff;font:700 17px var(--body);cursor:pointer;display:grid;place-items:center;padding:0;transition:border-color .15s ease,transform .15s ease}
.avbtn:hover{border-color:var(--green-soft);transform:translateY(-1px)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--wblack);border:1px solid var(--line);clip-path:var(--facet-sm);padding:4px;margin-bottom:30px}
.tabs button{border:0;background:transparent;clip-path:var(--facet-sm);padding:15px 6px;font:700 15.5px var(--body);color:var(--ink-soft);cursor:pointer;min-height:50px}
.tabs button[aria-current="page"]{background:var(--yellow);color:#15181D}

/* Vandaag-tab: kaartopening naast het formulier op brede schermen */
.today-grid{display:grid;gap:44px;align-items:start}
.today-grid .col{max-width:none}
@media (min-width:860px){
  .today-grid{grid-template-columns:1fr 1.15fr}
}

/* Upload / stage */
.stage{position:relative;display:grid;justify-items:center;gap:20px;margin-top:24px;min-height:380px;align-content:start}
.stage .cw{width:min(440px,90vw)}
.stage-placeholder{color:var(--muted);text-align:center;padding:64px 24px;border:1.5px dashed var(--line);border-radius:18px;width:100%;font-size:16px}
.result{margin:0;text-align:center;font-weight:600;color:var(--ink-soft);max-width:56ch;font-size:1.15em}

/* Shard-animatie + zotte pack-opening */
.shard-wrap{position:relative;width:min(320px,76vw);aspect-ratio:5/7;display:grid;place-items:center}
.shard{position:absolute;inset:0;border:2px solid var(--amber);clip-path:var(--facet);background:linear-gradient(160deg,var(--panel),var(--bg2));animation:spin-settle 1.5s cubic-bezier(.3,.8,.3,1) both}
.shard.s2{animation-delay:.08s;opacity:.6;border-color:var(--amber-soft)}
.shard.s3{animation-delay:.16s;opacity:.35}
@keyframes spin-settle{
  0%{transform:rotate(0deg) scale(.4);opacity:0}
  55%{transform:rotate(200deg) scale(1.06);opacity:1}
  100%{transform:rotate(360deg) scale(1);opacity:0}
}
.glow{position:absolute;inset:-30%;border-radius:50%;filter:blur(30px);opacity:0;animation:glow-in .7s ease-out .9s both}
@keyframes glow-in{from{opacity:0;transform:scale(.6)}to{opacity:.55;transform:scale(1)}}
.glow.common{background:radial-gradient(circle,var(--grey),transparent 70%)}
.glow.epic{background:radial-gradient(circle,#8B5CF6,transparent 70%)}
.glow.legendary{background:radial-gradient(circle,var(--gold),transparent 70%)}
.glow.cat{background:radial-gradient(circle,var(--cat),transparent 70%)}
.particles{position:absolute;inset:0;pointer-events:none}
.particle{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--pc,#fff);opacity:0;animation:spark-fly 1.1s ease-out forwards;animation-delay:var(--pd,0s)}
@keyframes spark-fly{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateX(0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--d)) scale(.2)}
}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti span{position:absolute;top:-8%;left:var(--l);width:8px;height:14px;background:var(--cc);animation:confetti-fall 1.9s var(--cd,0s) ease-in forwards}
@keyframes confetti-fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(340px) rotate(560deg);opacity:0}
}
.shake{animation:shake .4s ease}
@keyframes shake{
  10%,90%{transform:translateX(-1px)}
  20%,80%{transform:translateX(2px)}
  30%,50%,70%{transform:translateX(-5px)}
  40%,60%{transform:translateX(5px)}
}
.cardflip{animation:card-flip .85s cubic-bezier(.2,1.35,.35,1) both}
@keyframes card-flip{
  0%{transform:perspective(900px) rotateY(180deg) scale(.35);opacity:0}
  60%{transform:perspective(900px) rotateY(-14deg) scale(1.07);opacity:1}
  100%{transform:perspective(900px) rotateY(0) scale(1);opacity:1}
}

/* Kaarten: rechte kaarten met ronde hoeken, volledige illustratie, duidelijke rand per type */
.cw{container-type:inline-size;width:100%;position:relative}
.card{position:relative;aspect-ratio:5/7;border-radius:6.5cqw;border:2.2cqw solid var(--rc);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.14), 0 10px 26px -10px rgba(0,0,0,.65), 0 0 20px -3px var(--rc);
  background:var(--rbg);color:#241C0F;overflow:hidden}
.art{position:absolute;inset:0;background:var(--art);display:grid;place-items:center;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.chead{position:absolute;top:0;left:0;right:0;padding:4.4cqw 6cqw 6cqw;display:flex;justify-content:space-between;align-items:flex-start;gap:2cqw;
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.72) 70%,rgba(255,255,255,0));
  backdrop-filter:blur(9px) saturate(1.15);-webkit-backdrop-filter:blur(9px) saturate(1.15)}
.cname{color:#141414;font:800 7cqw/1.16 var(--display);text-shadow:none;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;max-width:75%}
.cname.xl{font-size:6cqw}
.cname.xxl{font-size:5cqw}
.hp{color:#141414;font:700 5.6cqw var(--body);white-space:nowrap;text-shadow:none}
.ptile{width:38cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.22);color:#fff;font:800 22cqw/1 var(--display)}
.ptile.cat{background:transparent;font-size:28cqw}
.cfoot{position:absolute;left:0;right:0;bottom:0;padding:4.5cqw 6cqw 5cqw;display:flex;flex-direction:column;gap:1.8cqw;color:#141414;
  background:linear-gradient(0deg,rgba(255,255,255,.78) 40%,rgba(255,255,255,.78) 60%,rgba(255,255,255,0));
  backdrop-filter:blur(9px) saturate(1.15);-webkit-backdrop-filter:blur(9px) saturate(1.15)}
.cfoot .row1{display:flex;justify-content:space-between;font:700 6cqw var(--body)}
.special{font:600 5.6cqw/1.2 var(--body);color:#141414;border-top:1px solid rgba(0,0,0,.22);padding-top:1.8cqw}
.special small{display:none;font-weight:500;color:rgba(20,20,20,.78)}
@container (min-width:180px){.special small{display:block;margin-top:1.5cqw}}
.flavor{font:italic 500 5.8cqw/1.25 var(--body);color:rgba(20,20,20,.78)}
.r-common{--rc:#8A98A1;--rbg:linear-gradient(165deg,#fff,#E7ECEF);--art:#DDE4E8}
.r-epic{--rc:#7C4FE0;--rbg:linear-gradient(140deg,#F3EEFF,#D5C7F7 45%,#F3EEFF 60%,#C4B0F2);--art:linear-gradient(135deg,#B9A2F0,#7F5FD0)}
.r-legendary{--rc:#D9A61C;--rbg:linear-gradient(140deg,#FFF6D6,#F1CF6A 45%,#FFF1BE 60%,#E2B83E);--art:linear-gradient(135deg,#F5D97A,#C99A1E)}
.r-legendary .art::after{
  content:"";position:absolute;inset:0;pointer-events:none;background-size:260% 260%;mix-blend-mode:overlay;
  background-image:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.7) 35%,rgba(255,213,120,.55) 45%,transparent 58%,rgba(255,255,255,.45) 74%,transparent 90%);
  animation:holo-sweep 4.2s linear infinite;
}
@keyframes holo-sweep{
  0%{background-position:0% 0%}
  100%{background-position:100% 100%}
}
.r-cat{--rc:#1F8F8A;--rbg:linear-gradient(165deg,#EAFBF9,#C9EEEA);--art:#A9DDD8}
.locked{filter:saturate(.15) brightness(.85)}
.q{font:800 30cqw/1 var(--display);color:rgba(0,0,0,.28)}
.dupe{position:absolute;right:-6px;top:-8px;background:var(--yellow);color:#15181D;clip-path:var(--facet-sm);padding:2px 9px;font:700 12px var(--body);z-index:2}

/* Boek */
.book{background:linear-gradient(160deg,#3B2E20,#241A10);clip-path:var(--facet);padding:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.spread{background:var(--page);clip-path:var(--facet-sm);padding:0;display:grid;grid-template-columns:300px 1fr;min-height:620px;position:relative;color:#241C0F}
.spread::before{content:"";position:absolute;left:300px;top:0;bottom:0;width:20px;margin-left:-10px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.15),transparent);pointer-events:none}
.index-page{padding:30px 22px;border-right:1px solid rgba(0,0,0,.1);overflow-y:auto}
.index-page h3{color:#241C0F;font-size:21px;margin-bottom:4px}
.index-page .sub{color:#6B5E4C;font-size:14px;margin-bottom:20px}
.index-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.index-list button{width:100%;text-align:left;background:none;border:0;padding:12px 12px;cursor:pointer;color:#241C0F;border-radius:0;display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 16px var(--body)}
.index-list button:hover{background:rgba(0,0,0,.05)}
.index-list button[aria-current="page"]{background:var(--yellow);color:#15181D}
.index-list .frac{font:600 13.5px var(--body);color:#8A7A63;font-variant-numeric:tabular-nums}
.index-list button[aria-current="page"] .frac{color:#15181D;opacity:.75}
.page-body{padding:30px 30px 22px;display:flex;flex-direction:column}
.page-body .pname{font-size:26px;margin-bottom:2px}
.page-body .pcount{color:#6B5E4C;font-size:15px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:1;align-content:start}
.slot{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;display:block;transition:transform .15s ease}
.slot:hover{transform:translateY(-3px)}
.pageturn{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid rgba(0,0,0,.1)}
.pageturn button{background:none;border:1px solid rgba(36,28,15,.25);clip-path:var(--facet-sm);padding:10px 18px;font:700 15px var(--body);cursor:pointer;color:#241C0F}
.pageturn button:disabled{opacity:.3;cursor:default}
.pageturn .pnum{font:600 14.5px var(--body);color:#8A7A63;font-variant-numeric:tabular-nums}
.page-body.turning{animation:pageturn .38s ease}
@keyframes pageturn{0%{opacity:0;transform:perspective(800px) rotateY(-8deg)}100%{opacity:1;transform:none}}

dialog{border:0;padding:0;background:transparent;max-width:none;overflow:visible}
dialog::backdrop{background:rgba(10,12,16,.78)}
.zoombox{width:min(440px,92vw);padding:18px;display:grid;gap:12px;justify-items:center;animation:zoom-in .22s ease both}
@keyframes zoom-in{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.zoombox .cw{width:100%}
.zoombox .link{color:#fff}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}

/* Account-instellingen modal (naam/e-mail/wachtwoord/profielfoto) */
.accbox{width:min(420px,92vw);padding:26px;display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);clip-path:var(--facet);animation:zoom-in .2s ease both}
.accbox h2{margin-bottom:4px}
.photorow{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.photopreview{width:64px;height:64px;border-radius:50%;background-color:var(--bg2);background-size:cover;background-position:center;border:2px solid var(--line);color:#fff;display:grid;place-items:center;font:700 20px var(--body);flex-shrink:0}
.accbox .rowbtns{display:flex;gap:12px;margin-top:6px}
.accbox .rowbtns .btn{width:auto;flex:1}
.accbox .link.danger{color:#F0897E}

/* Account-tab: 3D-personage + shop */
.acc-grid{display:grid;gap:28px;align-items:start}
@media (min-width:820px){.acc-grid{grid-template-columns:380px 1fr}}
.avatar3d{width:100%;aspect-ratio:3/4;background:linear-gradient(160deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:18px;overflow:hidden}
.avatar3d canvas{display:block;width:100%;height:100%}
.wallet{margin:12px 0 0;text-align:center;font:700 15px var(--body);color:var(--yellow-soft)}
.acc-controls{display:flex;flex-direction:column;gap:24px}
.opt-group h4{margin:0 0 10px;font:700 15px var(--body);color:var(--ink-soft)}
.swatches{display:flex;flex-wrap:wrap;gap:12px 10px}
.swatch{width:42px;height:42px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;background:var(--sw,#888);position:relative;display:grid;place-items:center;font-size:16px}
.swatch.active{border-color:var(--yellow)}
.swatch.locked{opacity:.55}
.styleopts{display:flex;flex-wrap:wrap;gap:8px}
.styleopts button{background:var(--panel);border:1px solid var(--line);color:var(--ink-soft);clip-path:var(--facet-sm);padding:10px 16px;font:600 14.5px var(--body);cursor:pointer}
.styleopts button.active{background:var(--amber);color:#12160f;border-color:var(--amber)}
.styleopts button.locked{opacity:.6}

@media (max-width:760px){
  .spread{grid-template-columns:1fr}
  .spread::before{display:none}
  .index-page{border-right:0;border-bottom:1px solid rgba(0,0,0,.1);max-height:220px}
}
@media (prefers-reduced-motion:reduce){
  .r-legendary .art::after,.cardflip,.tile.flip,.shard,.glow,.page-body.turning,.shake,.particle,.confetti span{animation:none}
}
</style>

const PARTICLE_COLORS = {
  common: ['#9aa7b3', '#c8d0d8'],
  epic: ['#8B5CF6', '#C4B0F2', '#F3EEFF'],
  legendary: ['#E8C34C', '#FFF1BE', '#C99A1E'],
  cat: ['#2FA79E', '#8fe0da']
};

const state = { session: null, cards: [], owned: new Map(), play: null, name: '', avatarUrl: null, wallet: 0, tab: 'today', page: 0 };

// Werkt alle plekken bij die het polycoins-saldo tonen (topbalk + account-tab)
function syncCoinUI() {
  document.querySelectorAll('[data-coin]').forEach(el => { el.textContent = state.wallet; });
}

const todayBrussels = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Brussels' });
const tiles = (word, cls) => [...word].map((ch, i) => `<span class="tile t-${cls[i]}">${ch}</span>`).join('');
const plural = n => n === 1 ? 'poging' : 'pogingen';

// ---------- Opstart en routing ----------
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  sb.auth.onAuthStateChange((_event, s) => {
    const changed = s?.user?.id !== state.session?.user?.id;
    state.session = s;
    if (changed) route();
  });
  route();
}

async function route() {
  teardownAvatar3D();
  if (!state.session) { renderAuth('login'); return; }
  app.innerHTML = '<p class="loading">Laden…</p>';
  try {
    await loadData();
    renderMain();
  } catch (e) {
    app.innerHTML = `<main class="wrap"><p role="alert" class="err">${esc(e.message)}</p><button class="btn" id="out">Uitloggen</button></main>`;
    $('#out').onclick = () => sb.auth.signOut();
  }
}

async function loadData() {
  const uid = state.session.user.id;
  const [cards, mine, play, prof, wallet] = await Promise.all([
    sb.from('cards').select('*').order('id'),
    sb.from('user_cards').select('card_id').eq('user_id', uid),
    sb.from('daily_plays').select('*').eq('user_id', uid).eq('play_date', todayBrussels()).maybeSingle(),
    sb.from('profiles').select('display_name, avatar_url').eq('id', uid).maybeSingle(),
    sb.from('user_wallet').select('polycoins').eq('user_id', uid).maybeSingle()
  ]);
  for (const r of [cards, mine, play, prof, wallet]) if (r.error) throw new Error(r.error.message);
  state.cards = cards.data;
  state.owned = new Map();
  for (const row of mine.data) state.owned.set(row.card_id, (state.owned.get(row.card_id) || 0) + 1);
  state.play = play.data;
  state.name = prof.data?.display_name || state.session.user.email.split('@')[0];
  state.avatarUrl = prof.data?.avatar_url || null;
  state.wallet = wallet.data?.polycoins || 0;
}

// ---------- Inloggen ----------
function renderAuth(mode) {
  const reg = mode === 'register';
  app.innerHTML = `
  <main class="wrap">
    <div class="hero" aria-hidden="true">${tiles('POLY', ['g','y','x','g'])}</div>
    <h1>Polygon <em>Card Collection</em></h1>
    <p class="hint">Los de dagelijkse Wordle op, plak je resultaat en verzamel facetkaarten van je collega's.</p>
    <form id="authform" class="form">
      ${reg ? '<label>Naam<input name="name" required autocomplete="nickname" maxlength="30"></label>' : ''}
      <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
      <label>Wachtwoord<input name="password" type="password" required minlength="6" autocomplete="${reg ? 'new-password' : 'current-password'}"></label>
      <button class="btn" type="submit">${reg ? 'Account maken' : 'Inloggen'}</button>
      <p id="authmsg" role="alert" class="msg"></p>
    </form>
    <button class="link" id="switch">${reg ? 'Ik heb al een account' : 'Nog geen account? Maak er een'}</button>
  </main>`;
  $('#switch').onclick = () => renderAuth(reg ? 'login' : 'register');
  $('#authform').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const msg = $('#authmsg');
    const btn = e.target.querySelector('button[type=submit]');
    msg.textContent = ''; msg.className = 'msg'; btn.disabled = true;
    try {
      if (reg) {
        const { data, error } = await sb.auth.signUp({
          email: f.get('email'), password: f.get('password'),
          options: { data: { display_name: f.get('name') } }
        });
        if (error) throw error;
        if (!data.session) {
          msg.textContent = 'Account gemaakt. Bevestig je e-mailadres via de mail die we stuurden en log daarna in.';
          msg.className = 'msg ok';
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
        if (error) throw error;
      }
    } catch (err) {
      msg.textContent = err.message; msg.className = 'msg err';
    } finally {
      btn.disabled = false;
    }
  };
}

// ---------- Kaart tekenen ----------
function renderCard(c, { locked = false, count = 1 } = {}) {
  const label = RARITY_LABEL[c.rarity];
  if (locked) {
    return `<div class="cw"><div class="card r-${c.rarity} locked" aria-label="Nog niet verzameld">
      <div class="art"><span class="q">?</span></div>
      <div class="cfoot"><div class="row1"><span>???</span><span>${label}</span></div></div>
    </div></div>`;
  }
  const initial = esc((c.person || '?').trim().charAt(0).toUpperCase());
  const art = c.image_url
    ? `<img src="${esc(c.image_url)}" alt="${esc(c.name)}" loading="lazy">`
    : (c.rarity === 'cat' ? '<span class="ptile cat">🐱</span>' : `<span class="ptile">${initial}</span>`);
  const special = c.special_name
    ? `<div class="special">★ ${esc(c.special_name)}${c.special_power ? ` (${esc(c.special_power)})` : ''}<small>${esc(c.special_desc)}</small></div>`
    : '';
  const flavor = c.flavor_text ? `<div class="flavor">"${esc(c.flavor_text)}"</div>` : '';
  const nameLen = c.name.length;
  const nameCls = nameLen > 22 ? 'cname xxl' : nameLen > 14 ? 'cname xl' : 'cname';
  return `<div class="cw">
    ${count > 1 ? `<span class="dupe">×${count}</span>` : ''}
    <div class="card r-${c.rarity}">
      <div class="art">${art}</div>
      <div class="chead"><span class="${nameCls}">${esc(c.name)}</span><span class="hp">HP ${esc(c.hp)}</span></div>
      <div class="cfoot">
        ${flavor}
        <div class="row1"><span>${label}</span><span>ATK ${esc(c.attack)} / DEF ${esc(c.defense)}</span></div>
        ${special}
      </div>
    </div></div>`;
}

function resizeImageToDataUrl(file, maxSize = 200) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Foto kon niet gelezen worden.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Ongeldige afbeelding.'));
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', .85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function openAccountModal() {

    const initial = esc((state.name || '?').trim().charAt(0).toUpperCase());
    dlg.innerHTML = `<div class="accbox">
      <h2>Account</h2>
      <p class="hint">Pas je naam, e-mail, wachtwoord of profielfoto aan.</p>
      <div class="photorow">
        <div class="photopreview" id="photoPreview" style="${pendingPhoto ? `background-image:url('${esc(pendingPhoto)}')` : ''}">${pendingPhoto ? '' : initial}</div>
        <div>
          <input type="file" id="photoInput" accept="image/*" class="sr" />
          <button type="button" class="link" id="photoBtn">Foto kiezen…</button>
        </div>
      </div>
      <form id="accForm" class="form">
        <label>Naam<input name="name" value="${esc(state.name)}" required maxlength="30"></label>
        <label>E-mail<input name="email" type="email" value="${esc(state.session.user.email)}" required></label>
        <label>Nieuw wachtwoord<input name="password" type="password" minlength="6" autocomplete="new-password" placeholder="Laat leeg om te behouden"></label>
        <p id="accSaveMsg" role="alert" class="msg"></p>
        <div class="rowbtns">
          <button type="button" class="link" id="accCancel">Annuleren</button>
          <button class="btn" type="submit">Opslaan</button>
        </div>
      </form>
      <button type="button" class="link danger" id="accLogout">Uitloggen</button>
    </div>`;
    $('#accCancel').onclick = () => dlg.close();
    $('#photoBtn').onclick = () => $('#photoInput').click();
    $('#photoInput').onchange = async e => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        pendingPhoto = await resizeImageToDataUrl(file);
        renderBox();
      } catch (err) {
        $('#accSaveMsg').className = 'msg err'; $('#accSaveMsg').textContent = err.message;
      }
    };
    $('#accLogout').onclick = () => sb.auth.signOut();
    $('#accForm').onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const msg = $('#accSaveMsg');
      const btn = e.target.querySelector('button[type=submit]');
      msg.className = 'msg'; msg.textContent = 'Opslaan…'; btn.disabled = true;
      try {
        const name = f.get('name').trim();
        const email = f.get('email').trim();
        const password = f.get('password');
        if (name !== state.name || pendingPhoto !== state.avatarUrl) {
          const { error } = await sb.from('profiles').update({ display_name: name, avatar_url: pendingPhoto }).eq('id', state.session.user.id);
          if (error) throw error;
        }
        const authUpdates = {};
        if (email !== state.session.user.email) authUpdates.email = email;
        if (password) authUpdates.password = password;
        if (Object.keys(authUpdates).length) {
          const { error } = await sb.auth.updateUser(authUpdates);
          if (error) throw error;
        }
        state.name = name;
        state.avatarUrl = pendingPhoto;
        msg.className = 'msg ok';
        msg.textContent = authUpdates.email ? 'Opgeslagen! Bevestig je nieuwe e-mailadres via de mail die we stuurden.' : 'Opgeslagen!';
        setTimeout(() => { dlg.close(); renderMain(); }, authUpdates.email ? 1600 : 500);
      } catch (err) {
        msg.className = 'msg err'; msg.textContent = err.message; btn.disabled = false;
      }
    };
  };
  renderBox();
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); }, { once: true });
  dlg.showModal();
}

function renderView() {
  document.querySelectorAll('.tabs button').forEach(b => {
    if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  const view = $('#view');
  if (state.tab === 'today') renderToday(view);
  else if (state.tab === 'book') renderBook(view);
  else renderAccount(view);
}

  return play.solved
    ? `Opgelost in ${play.attempts} ${plural(play.attempts)}.`
    : 'Niet opgelost vandaag. Je kreeg een troostkat.';
}

  if (state.play) {
    const card = state.cards.find(c => c.id === state.play.card_id);
    view.innerHTML = `<section class="today-grid">
      <div class="col">

      </div>
      <div class="stage" id="stage">${card ? `<div class="cardflip">${renderCard(card)}</div>` : ''}</div>
    </section>`;
    return;
  }
  view.innerHTML = `<section class="today-grid">
    <div class="col">
      <h2>Wordle van vandaag</h2>
      <p class="hint">Klik in Discord op <strong>Share</strong> bij je afgewerkte Wordle en plak het resultaat hieronder. Vul ook het woord in dat je geraden hebt — zo weten we zeker dat je de Wordle echt gespeeld en opgelost hebt. Je trekt één kaart per dag, en hoe minder pogingen, hoe zeldzamer je kaart. Heb je een kaart al? Dan wordt ze omgezet in polycoins voor de shop.</p>
      <div id="uploadbox" class="form">
        <label for="sharetext">Wordle-resultaat<textarea id="sharetext" rows="7" placeholder="Plak hier je gedeelde Wordle-resultaat"></textarea></label>
        <label for="word">Het geraden woord<input id="word" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="bv. CRANE"></label>
        <button class="btn" id="go" disabled>Kaart trekken</button>
        <p id="msg" role="alert" class="msg"></p>
      </div>
    </div>
    <div class="stage" id="stage" aria-live="polite"><p class="stage-placeholder">Hier verschijnt je kaart zodra je 'm trekt.</p></div>
  </section>`;
  const checkReady = () => {
    $('#go').disabled = $('#sharetext').value.trim().length < 10 || $('#word').value.trim().length !== 5;
    $('#msg').textContent = '';
  };
  $('#sharetext').oninput = checkReady;
  $('#word').oninput = checkReady;
  $('#go').onclick = async () => {
    const msg = $('#msg'), go = $('#go');
    go.disabled = true; msg.className = 'msg'; msg.textContent = 'Resultaat controleren…';
    try {
      const text = $('#sharetext').value;
      const word = $('#word').value;
      const { data, error } = await sb.functions.invoke('submit-wordle', { body: { text, word } });
      if (error) {
        let errText = 'Er ging iets mis. Probeer het opnieuw.';
        try { errText = (await error.context.json()).error || errText; } catch (_) {}
        throw new Error(errText);
      }
      state.play = { solved: data.solved, attempts: data.attempts, card_id: data.card.id, play_date: todayBrussels() };
      if (!data.isDuplicate) {
        state.owned.set(data.card.id, (state.owned.get(data.card.id) || 0) + 1);
      } else if (data.coinsEarned) {
        state.wallet += data.coinsEarned;
        syncCoinUI();
      }
      $('#uploadbox').hidden = true;
      await revealCard(data);
    } catch (err) {
      msg.className = 'msg err'; msg.textContent = err.message; go.disabled = false;
    }
  };
}

async function revealCard(res) {
  const stage = $('#stage');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    const colors = PARTICLE_COLORS[res.rarity] || PARTICLE_COLORS.common;
    const particleCount = res.rarity === 'legendary' ? 28 : res.rarity === 'epic' ? 20 : 12;
    const particles = Array.from({ length: particleCount }, () => {
      const a = Math.random() * 360, d = 70 + Math.random() * 90, delay = Math.random() * .25;
      const c = colors[Math.floor(Math.random() * colors.length)];
      return `<span class="particle" style="--a:${a}deg;--d:${d}px;--pd:${delay}s;--pc:${c}"></span>`;
    }).join('');
    stage.innerHTML = `<div class="shard-wrap" aria-hidden="true">
      <div class="glow ${res.rarity}"></div>
      <div class="particles">${particles}</div>
      <div class="shard s3"></div><div class="shard s2"></div><div class="shard"></div>
    </div>`;
    await sleep(1500);
    const pattern = REVEAL_PATTERN[res.rarity];
    stage.innerHTML = `<div class="tilerow" aria-hidden="true">${[...'POLY'].map((ch, i) =>
      `<span class="tile flip t-pending" style="--i:${i};--final:${TILE_COLORS[pattern[i]]}">${ch}</span>`).join('')}</div>`;
    await sleep(1200);
    if (res.rarity === 'epic' || res.rarity === 'legendary') {
      stage.classList.add('shake');
      setTimeout(() => stage.classList.remove('shake'), 420);
    }
  }
  const text = res.solved
    ? (res.isDuplicate
        ? `Opgelost in ${res.attempts} ${plural(res.attempts)}. Je had "${esc(res.card.name)}" al — omgezet in ${res.coinsEarned} polycoins.`
        : `Opgelost in ${res.attempts} ${plural(res.attempts)}. Je trok een ${RARITY_LABEL[res.rarity]}-kaart.`)
    : 'Niet opgelost vandaag. Je krijgt een troostkat.';
  const confetti = (!reduce && res.rarity === 'legendary')
    ? `<div class="confetti">${Array.from({ length: 24 }, () => {
        const left = Math.random() * 100, delay = Math.random() * .6;
        const c = ['#E8C34C', '#F0897E', '#8B5CF6', '#4C8A47'][Math.floor(Math.random() * 4)];
        return `<span style="--l:${left}%;--cd:${delay}s;--cc:${c}"></span>`;
      }).join('')}</div>`
    : '';
  stage.innerHTML = `<div class="cardflip">${renderCard(res.card)}</div>${confetti}<p class="result">${text}</p>`;
}

// ---------- Tab: Mijn boek ----------
function bookGroups() {
  const groups = [];
  for (const c of state.cards) {
    let g = groups.find(x => x.name === c.person);
    if (!g) { g = { name: c.person, cards: [] }; groups.push(g); }
    g.cards.push(c);
  }
  for (const g of groups) g.cards.sort((a, b) => a.slot - b.slot);
  return groups;
}
const ownedIn = g => g.cards.filter(c => state.owned.has(c.id)).length;

function renderBook(view) {
  const groups = bookGroups();
  if (!groups.length) { view.innerHTML = '<p class="hint">Er zijn nog geen kaarten in de database.</p>'; return; }
  if (state.page >= groups.length) state.page = 0;
  drawBook(view, groups, false);
}

function drawBook(view, groups, animate) {
  const g = groups[state.page];
  const people = groups.filter(x => x.name !== 'Katten');
  const total = people.reduce((n, x) => n + x.cards.length, 0);
  const have = people.reduce((n, x) => n + ownedIn(x), 0);
  const dupes = [...state.owned.values()].reduce((n, v) => n + (v - 1), 0);

  view.innerHTML = `<div class="book"><div class="spread">
    <nav class="index-page" aria-label="Collega's">
      <h3>Verzamelboek</h3>
      <p class="sub">${have}/${total} kaarten${dupes ? ` · ${dupes} dubbel` : ''}</p>
      <ul class="index-list">${groups.map((x, i) =>
        `<li><button data-i="${i}" aria-current="${i === state.page}">${esc(x.name)}<span class="frac">${ownedIn(x)}/${x.cards.length}</span></button></li>`).join('')}</ul>
    </nav>
    <div class="page-body${animate ? ' turning' : ''}">
      <h3 class="pname">${esc(g.name)}</h3>
      <p class="pcount">${ownedIn(g)} van ${g.cards.length} verzameld</p>
      <div class="grid">${g.cards.map(c => {
        const n = state.owned.get(c.id) || 0;
        return `<button class="slot" data-id="${c.id}" aria-label="${n ? esc(c.name) + ' bekijken' : 'Nog niet verzameld'}">${renderCard(c, n ? { count: n } : { locked: true })}</button>`;
      }).join('')}</div>
      <div class="pageturn">
        <button id="prevp" ${state.page === 0 ? 'disabled' : ''}>← Vorige</button>
        <span class="pnum">${state.page + 1} / ${groups.length}</span>
        <button id="nextp" ${state.page === groups.length - 1 ? 'disabled' : ''}>Volgende →</button>
      </div>
    </div>
  </div></div>`;

  view.querySelectorAll('.index-list button').forEach(b => {
    b.onclick = () => { state.page = Number(b.dataset.i); drawBook(view, groups, true); };
  });
  $('#prevp', view).onclick = () => { state.page = Math.max(0, state.page - 1); drawBook(view, groups, true); };
  $('#nextp', view).onclick = () => { state.page = Math.min(groups.length - 1, state.page + 1); drawBook(view, groups, true); };
  view.querySelectorAll('button.slot').forEach(b => {
    b.onclick = () => {
      const card = state.cards.find(c => c.id === Number(b.dataset.id));
      const n = state.owned.get(card.id) || 0;
      $('#zcard').innerHTML = renderCard(card, n ? { count: n } : { locked: true });
      $('#zoom').showModal();
    };
  });
}

}

async function initAccountTab() {
  const uid = state.session.user.id;
  const [avatarRow, walletRow, items, inv] = await Promise.all([
    sb.from('avatars').select('config').eq('user_id', uid).maybeSingle(),
    sb.from('user_wallet').select('polycoins').eq('user_id', uid).maybeSingle(),
    sb.from('shop_items').select('*').order('id'),
    sb.from('user_inventory').select('item_id').eq('user_id', uid),
  ]);
  accConfig = (avatarRow.data && avatarRow.data.config && Object.keys(avatarRow.data.config).length)
    ? avatarRow.data.config
    : { gender: 'v', hairstyle: 'short', hairColor: FREE_HAIR[0], skinColor: FREE_SKIN[0], clothingColor: FREE_CLOTHES[0], glasses: false, accessory: null };
  state.wallet = walletRow.data?.polycoins || 0;
  syncCoinUI();
  shopItems = items.data || [];
  ownedItemIds = new Set((inv.data || []).map(r => r.item_id));

  setupAvatar3D();
  drawAccountControls();
}

function setupAvatar3D() {
  const host = $('#avatar3d');
  if (!host || typeof THREE === 'undefined') return;
  teardownAvatar3D();
  const w = host.clientWidth || 320, h = host.clientHeight || 400;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  host.innerHTML = '';
  host.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, w / h, 0.1, 100);
  camera.position.set(0, 1.15, 4.2);
  camera.lookAt(0, 0.75, 0);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x33241a, 1.1));
  const key = new THREE.DirectionalLight(0xfff3d6, 1.1);
  key.position.set(2, 3, 2);
  scene.add(key);
  const group = buildAvatarGroup(accConfig);
  scene.add(group);
  avatarState = { renderer, scene, camera, group, raf: 0, t: 0 };
  const animate = () => {
    if (!avatarState) return;
    avatarState.t += 0.01;
    avatarState.group.rotation.y = Math.sin(avatarState.t * 0.6) * 0.5;
    avatarState.renderer.render(avatarState.scene, avatarState.camera);
    avatarState.raf = requestAnimationFrame(animate);
  };
  animate();
}

function teardownAvatar3D() {
  if (avatarState) {
    cancelAnimationFrame(avatarState.raf);
    avatarState.renderer.dispose();
    avatarState = null;
  }
}

function refreshAvatar3D() {
  if (!avatarState) return;
  avatarState.scene.remove(avatarState.group);
  const group = buildAvatarGroup(accConfig);
  avatarState.scene.add(group);
  avatarState.group = group;
}

function buildAvatarGroup(cfg) {
  const g = new THREE.Group();
  const isM = cfg.gender === 'm';
  const skin = new THREE.MeshStandardMaterial({ color: cfg.skinColor, roughness: .7 });
  const cloth = new THREE.MeshStandardMaterial({ color: cfg.clothingColor, roughness: .8 });
  const hairMat = new THREE.MeshStandardMaterial({ color: cfg.hairColor, roughness: .6 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: '#2B303B', roughness: .8 });

  const torso = new THREE.Mesh(new THREE.CylinderGeometry(isM ? .46 : .38, isM ? .4 : .3, 1.1, 16), cloth);
  torso.position.y = .55; g.add(torso);

  const hip = new THREE.Mesh(new THREE.CylinderGeometry(isM ? .38 : .34, .32, .3, 16), cloth);
  hip.position.y = -.05; g.add(hip);

  const head = new THREE.Mesh(new THREE.SphereGeometry(.34, 20, 20), skin);
  head.position.y = 1.36; g.add(head);

  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.14, .16, .16, 12), skin);
  neck.position.y = 1.08; g.add(neck);

  [-1, 1].forEach(side => {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(.11, .1, .95, 10), cloth);
    arm.position.set(side * (isM ? .58 : .5), .55, 0);
    arm.rotation.z = side * .12;
    g.add(arm);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(.11, 10, 10), skin);
    hand.position.set(side * (isM ? .63 : .55), .02, 0);
    g.add(hand);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(.15, .13, 1.05, 10), pantsMat);
    leg.position.set(side * .18, -.75, 0);
    g.add(leg);
  });

  if (cfg.hairstyle === 'short') {
    const h = new THREE.Mesh(new THREE.SphereGeometry(.36, 16, 16, 0, Math.PI * 2, 0, Math.PI * .55), hairMat);
    h.position.y = 1.42; g.add(h);
  } else if (cfg.hairstyle === 'bob') {
    const h = new THREE.Mesh(new THREE.SphereGeometry(.4, 16, 16, 0, Math.PI * 2, 0, Math.PI * .75), hairMat);
    h.position.y = 1.38; g.add(h);
  } else if (cfg.hairstyle === 'ponytail') {
    const h = new THREE.Mesh(new THREE.SphereGeometry(.36, 16, 16, 0, Math.PI * 2, 0, Math.PI * .55), hairMat);
    h.position.y = 1.42; g.add(h);
    const tail = new THREE.Mesh(new THREE.CylinderGeometry(.06, .03, .5, 8), hairMat);
    tail.position.set(0, 1.15, -.32); tail.rotation.x = .5; g.add(tail);
  } else if (cfg.hairstyle === 'long') {
    const h = new THREE.Mesh(new THREE.SphereGeometry(.38, 16, 16, 0, Math.PI * 2, 0, Math.PI * .6), hairMat);
    h.position.y = 1.4; g.add(h);
    const back = new THREE.Mesh(new THREE.CylinderGeometry(.32, .22, .8, 14), hairMat);
    back.position.set(0, .98, -.12); g.add(back);
  }

  if (cfg.glasses) {
    const lensMat = new THREE.MeshStandardMaterial({ color: '#1B2028', roughness: .3 });
    [-1, 1].forEach(side => {
      const lens = new THREE.Mesh(new THREE.TorusGeometry(.08, .015, 8, 16), lensMat);
      lens.position.set(side * .13, 1.38, .3); g.add(lens);
    });
    const bridge = new THREE.Mesh(new THREE.CylinderGeometry(.012, .012, .08, 6), lensMat);
    bridge.rotation.z = Math.PI / 2;
    bridge.position.set(0, 1.38, .3); g.add(bridge);
  }

  if (cfg.accessory === 'hat') {
    const hat = new THREE.Mesh(new THREE.ConeGeometry(.3, .35, 16), new THREE.MeshStandardMaterial({ color: '#B03B3B' }));
    hat.position.y = 1.72; g.add(hat);
  } else if (cfg.accessory === 'crown') {
    const crown = new THREE.Mesh(new THREE.CylinderGeometry(.32, .34, .18, 8), new THREE.MeshStandardMaterial({ color: '#E8C34C', metalness: .6, roughness: .3 }));
    crown.position.y = 1.68; g.add(crown);
  }

  return g;
}

function itemFor(category, key) {
  return shopItems.find(i => i.category === category && i.key === key);
}
function isUnlocked(category, key) {
  const free = { hair_color: FREE_HAIR, skin_color: FREE_SKIN, clothing_color: FREE_CLOTHES }[category];
  if (free && free.includes(key)) return true;
  const item = itemFor(category, key);
  return item ? ownedItemIds.has(item.id) : false;
}

function drawAccountControls() {
  const el = $('#accControls');
  if (!el) return;
  const shopHair = shopItems.filter(i => i.category === 'hair_color');
  const shopSkin = shopItems.filter(i => i.category === 'skin_color');
  const shopClothes = shopItems.filter(i => i.category === 'clothing_color');
  const shopAcc = shopItems.filter(i => i.category === 'accessory');
  const fieldFor = { hair_color: 'hairColor', skin_color: 'skinColor', clothing_color: 'clothingColor' };

  const swatchHtml = (category, key) => {
    const item = itemFor(category, key);
    const unlocked = isUnlocked(category, key);
    const active = accConfig[fieldFor[category]] === key;
    const title = item ? `${esc(item.label)}${unlocked ? '' : ` · ${item.price} polycoins`}` : '';
    return `<button type="button" class="swatch ${active ? 'active' : ''} ${unlocked ? '' : 'locked'}"
      style="--sw:${key}" data-cat="${category}" data-key="${key}" ${item ? `data-item="${item.id}"` : ''}
      title="${title}" aria-label="${title || key}">${unlocked ? '' : '🔒'}</button>`;
  };

  el.innerHTML = `
    <div class="opt-group">
      <h4>Geslacht</h4>
      <div class="styleopts">
        <button type="button" data-set="gender" data-val="v" class="${accConfig.gender === 'v' ? 'active' : ''}">Vrouw</button>
        <button type="button" data-set="gender" data-val="m" class="${accConfig.gender === 'm' ? 'active' : ''}">Man</button>
      </div>
    </div>
    <div class="opt-group">
      <h4>Kapsel</h4>
      <div class="styleopts">${HAIRSTYLES.map(h => `<button type="button" data-set="hairstyle" data-val="${h.id}" class="${accConfig.hairstyle === h.id ? 'active' : ''}">${h.label}</button>`).join('')}</div>
    </div>
    <div class="opt-group">
      <h4>Haarkleur</h4>
      <div class="swatches">${FREE_HAIR.map(c => swatchHtml('hair_color', c)).join('')}${shopHair.map(i => swatchHtml('hair_color', i.key)).join('')}</div>
    </div>
    <div class="opt-group">
      <h4>Huidskleur</h4>
      <div class="swatches">${FREE_SKIN.map(c => swatchHtml('skin_color', c)).join('')}${shopSkin.map(i => swatchHtml('skin_color', i.key)).join('')}</div>
    </div>
    <div class="opt-group">
      <h4>Kledijkleur</h4>
      <div class="swatches">${FREE_CLOTHES.map(c => swatchHtml('clothing_color', c)).join('')}${shopClothes.map(i => swatchHtml('clothing_color', i.key)).join('')}</div>
    </div>
    <div class="opt-group">
      <h4>Accessoires</h4>
      <div class="styleopts">
        <button type="button" data-set="glasses" class="${accConfig.glasses ? 'active' : ''}">👓 Bril</button>
        <button type="button" data-set="accessory" data-clear="1" class="${!accConfig.accessory ? 'active' : ''}">Geen hoofddeksel</button>
        ${shopAcc.map(i => `<button type="button" data-set="accessory" data-val="${i.key}" data-item="${i.id}" class="${accConfig.accessory === i.key ? 'active' : ''} ${isUnlocked('accessory', i.key) ? '' : 'locked'}">${isUnlocked('accessory', i.key) ? '' : '🔒 '}${esc(i.label)}${isUnlocked('accessory', i.key) ? '' : ` · ${i.price}🪙`}</button>`).join('')}
      </div>
    </div>
    <button class="btn" id="saveAvatar">Personage opslaan</button>
    <p id="accMsg" class="msg" role="alert"></p>
  `;
  syncCoinUI();

  el.querySelectorAll('.styleopts button[data-set]').forEach(btn => {
    btn.onclick = async () => {
      const set = btn.dataset.set, val = btn.dataset.val;
      if (set === 'glasses') {
        accConfig.glasses = !accConfig.glasses;
      } else if (set === 'accessory') {
        if (btn.dataset.clear) {
          accConfig.accessory = null;
        } else if (!isUnlocked('accessory', val)) {
          await tryBuy(Number(btn.dataset.item));
          return;
        } else {
          accConfig.accessory = val;
        }
      } else {
        accConfig[set] = val;
      }
      refreshAvatar3D();
      drawAccountControls();
    };
  });

  el.querySelectorAll('.swatch').forEach(btn => {
    btn.onclick = async () => {
      const cat = btn.dataset.cat, key = btn.dataset.key;
      if (!isUnlocked(cat, key)) {
        await tryBuy(Number(btn.dataset.item));
        return;
      }
      accConfig[fieldFor[cat]] = key;
      refreshAvatar3D();
      drawAccountControls();
    };
  });

  $('#saveAvatar').onclick = async () => {
    const msg = $('#accMsg');
    msg.className = 'msg'; msg.textContent = 'Opslaan…';
    try {
      const { error } = await sb.from('avatars').upsert({ user_id: state.session.user.id, config: accConfig, updated_at: new Date().toISOString() });
      if (error) throw error;
      msg.className = 'msg ok'; msg.textContent = 'Opgeslagen!';
    } catch (err) {
      msg.className = 'msg err'; msg.textContent = err.message;
    }
  };
}

async function tryBuy(itemId) {
  const msg = $('#accMsg');
  const item = shopItems.find(i => i.id === itemId);
  if (!item) return;
  if (!confirm(`"${item.label}" kost ${item.price} polycoins. Kopen?`)) return;
  msg.className = 'msg'; msg.textContent = 'Aankoop verwerken…';
  try {
    const { data, error } = await sb.functions.invoke('buy-item', { body: { item_id: itemId } });
    if (error) {
      let errText = 'Aankoop mislukt.';
      try { errText = (await error.context.json()).error || errText; } catch (_) {}
      throw new Error(errText);
    }
    ownedItemIds.add(itemId);
    state.wallet = data.newBalance;
    syncCoinUI();
    msg.className = 'msg ok'; msg.textContent = `Gekocht! Nieuw saldo: ${state.wallet} polycoins.`;
    drawAccountControls();
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = err.message;
  }
}

init();
</script>
</body>
</html>
