async function drawTradeBuilder(friendId, friendName, prefill = null) {
  const host = $('#tradeBuilder');
  host.innerHTML = '<p class="hint">Dubbels laden…</p>';
  const uid = state.session.user.id;
  const [mineRes, theirsRes] = await Promise.all([
    sb.from('user_cards').select('card_id').eq('user_id', uid),
    sb.from('user_cards').select('card_id').eq('user_id', friendId),
  ]);
  if (mineRes.error || theirsRes.error) { host.innerHTML = `<p class="msg err">${esc((mineRes.error || theirsRes.error).message)}</p>`; return; }
  const mine = countByCard(mineRes.data || []);
  const theirs = countByCard(theirsRes.data || []);
  const myDupes = [...mine.entries()].filter(([, n]) => n > 1);
  const theirDupes = [...theirs.entries()].filter(([, n]) => n > 1);

  const pick = { mine: new Map(), theirs: new Map() }; // card_id -> aantal geselecteerd
  if (prefill) {
    for (const id of prefill.mine) pick.mine.set(id, (pick.mine.get(id) || 0) + 1);
    for (const id of prefill.theirs) pick.theirs.set(id, (pick.theirs.get(id) || 0) + 1);
  }

  const rowHtml = (side, cardId, max, selected) => {
    const c = state.cards.find(x => x.id === cardId);
    if (!c) return '';
    return `<div class="dup-row">
      <span class="trade-chip r-${c.rarity}">${esc(c.name)}</span>
      <span class="dup-owned">(${max + 1}× in bezit)</span>
      <div class="stepper">
        <button type="button" class="step-btn" data-side="${side}" data-card="${cardId}" data-d="-1">−</button>
        <span class="step-val" data-val="${side}-${cardId}">${selected}</span>
        <button type="button" class="step-btn" data-side="${side}" data-card="${cardId}" data-d="1">+</button>
      </div>
    </div>`;
  };

  const draw = () => {
    host.innerHTML = `<div class="trade-builder">
      <div>
        <h4>Jouw dubbels</h4>
        ${myDupes.length ? myDupes.map(([id, n]) => rowHtml('mine', id, n - 1, pick.mine.get(id) || 0)).join('') : '<p class="hint">Je hebt geen dubbels.</p>'}
      </div>
      <div>
        <h4>Dubbels van ${esc(friendName)}</h4>
        ${theirDupes.length ? theirDupes.map(([id, n]) => rowHtml('theirs', id, n - 1, pick.theirs.get(id) || 0)).join('') : '<p class="hint">Geen dubbels bekend.</p>'}
      </div>
    </div>
    <p id="builderMsg" class="msg" role="alert"></p>
    <button class="btn" id="sendTrade" type="button" style="max-width:280px">${prefill ? 'Tegenbod versturen' : 'Ruilvoorstel versturen'}</button>`;

    host.querySelectorAll('.step-btn').forEach(btn => {
      btn.onclick = () => {
        const side = btn.dataset.side, cardId = Number(btn.dataset.card), d = Number(btn.dataset.d);
        const map = pick[side];
        const max = side === 'mine' ? mine.get(cardId) - 1 : theirs.get(cardId) - 1;
        const cur = map.get(cardId) || 0;
        const next = Math.max(0, Math.min(max, cur + d));
        map.set(cardId, next);
        host.querySelector(`[data-val="${side}-${cardId}"]`).textContent = next;
      };
    });

    $('#sendTrade').onclick = async () => {
      const bMsg = $('#builderMsg');
      const myCards = [...pick.mine.entries()].flatMap(([id, n]) => Array(n).fill(id));
      const theirCards = [...pick.theirs.entries()].flatMap(([id, n]) => Array(n).fill(id));
      if (!myCards.length && !theirCards.length) { bMsg.className = 'msg err'; bMsg.textContent = 'Selecteer minstens één kaart.'; return; }
      bMsg.className = 'msg'; bMsg.textContent = 'Versturen…';
      try {
        if (prefill) {
          await respondTrade(prefill.tradeId, 'counter', { p_proposer_cards: prefill.proposerIsMe ? myCards : theirCards, p_recipient_cards: prefill.proposerIsMe ? theirCards : myCards });
        } else {
          const { error } = await sb.rpc('create_trade', { p_friend_id: friendId, p_my_cards: myCards, p_their_cards: theirCards });
          if (error) throw error;
          bMsg.className = 'msg ok'; bMsg.textContent = 'Voorstel verstuurd!';
          setTimeout(() => renderTrade($('#view')), 600);
        }
      } catch (err) {
        bMsg.className = 'msg err'; bMsg.textContent = err.message;
      }
    };
  };
  draw();
}

function openCounterBuilder(t, others) {
  const uid = state.session.user.id;
  const proposerIsMe = t.proposer_id === uid;
  const otherId = proposerIsMe ? t.recipient_id : t.proposer_id;
  const otherName = others[otherId] || '…';
  $('#tradeFriend').value = '';
  drawTradeBuilder(otherId, otherName, {
    tradeId: t.id,
    proposerIsMe,
    mine: proposerIsMe ? t.proposer_cards : t.recipient_cards,
    theirs: proposerIsMe ? t.recipient_cards : t.proposer_cards,
  });
  $('#tradeBuilder').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ---------- Tab: Battle ----------
// Stap 1: oefengevecht tegen de computer. De gevechtsregels zitten in simulateBattle,
// zodat later ook gevechten tegen vrienden dezelfde regels kunnen gebruiken.
const TEAM_SIZE = 3;
const RARITY_ORDER = { legendary: 0, epic: 1, common: 2, cat: 3 };
const battleState = { team: [] }; // gekozen card_ids, in volgorde

function simulateBattle(teamA, teamB, rand = Math.random) {
  const mk = cards => cards.map(c => {
    const maxHp = Number(c.hp) || 50;
    return { card: c, hp: maxHp, maxHp, usedSpecial: false };
  });
  const sides = { A: { fighters: mk(teamA), active: 0 }, B: { fighters: mk(teamB), active: 0 } };
  const events = [];
  const snap = () => ({
    A: { active: sides.A.active, hps: sides.A.fighters.map(f => f.hp) },
    B: { active: sides.B.active, hps: sides.B.fighters.map(f => f.hp) }
  });
  let turn = rand() < 0.5 ? 'A' : 'B';
  events.push({ type: 'start', first: turn, state: snap() });
  for (let i = 0; i < 300; i++) {
    const other = turn === 'A' ? 'B' : 'A';
    const att = sides[turn].fighters[sides[turn].active];
    const def = sides[other].fighters[sides[other].active];
    const atk = Number(att.card.attack) || 10, dfn = Number(def.card.defense) || 0;
    let dmg, kind = 'hit';
    if (att.card.special_power && !att.usedSpecial && att.hp <= att.maxHp / 2) {
      att.usedSpecial = true; kind = 'special';
      dmg = Number(att.card.special_power);
    } else {
      dmg = Math.max(Math.round(atk * 0.25), Math.round(atk * (0.85 + rand() * 0.3) - dfn * 0.5));
      if (rand() < 0.1) { dmg = Math.round(dmg * 1.5); kind = 'crit'; }
    }
    def.hp = Math.max(0, def.hp - dmg);
    events.push({ type: 'attack', side: turn, kind, dmg, attacker: att.card, defender: def.card, state: snap() });
    if (def.hp === 0) {
      events.push({ type: 'ko', side: other, card: def.card, state: snap() });
      if (sides[other].active === sides[other].fighters.length - 1) {
        events.push({ type: 'end', winner: turn, state: snap() });
        return events;
      }
      sides[other].active++;
      events.push({ type: 'enter', side: other, card: sides[other].fighters[sides[other].active].card, state: snap() });
    }
    turn = other;
  }
  // Veiligheidsnet: na te veel beurten wint wie procentueel het meeste HP over heeft
  const left = s => s.fighters.reduce((n, f) => n + f.hp / f.maxHp, 0);
  events.push({ type: 'end', winner: left(sides.A) >= left(sides.B) ? 'A' : 'B', state: snap() });
  return events;
}

const randomOpponent = team => team.map(c => {
  const pool = state.cards.filter(x => x.rarity === c.rarity);
  return pool[Math.floor(Math.random() * pool.length)];
});

// Zet het opgeslagen verloop van een server-gevecht om naar hetzelfde formaat als simulateBattle
function fromServerEvents(events, teams) {
  const other = s => s === 'A' ? 'B' : 'A';
  return events.map(e => {
    if (e.t === 'start') return { type: 'start', first: e.first, state: e.st };
    if (e.t === 'atk') return { type: 'attack', side: e.s, kind: e.k, dmg: e.d, attacker: teams[e.s][e.ai], defender: teams[other(e.s)][e.di], state: e.st };
    if (e.t === 'ko') return { type: 'ko', side: e.s, card: teams[e.s][e.i], state: e.st };
    if (e.t === 'enter') return { type: 'enter', side: e.s, card: teams[e.s][e.i], state: e.st };
    return { type: 'end', winner: e.w, state: e.st };
  });
}

// Wissel kant A en B om, zodat "jij" altijd links staat
function flipEvents(events) {
  const f = s => s === 'A' ? 'B' : s === 'B' ? 'A' : s;
  return events.map(e => ({ ...e, side: f(e.side), first: f(e.first), winner: f(e.winner), state: { A: e.state.B, B: e.state.A } }));
}

const battleErr = (view, e) => { view.innerHTML = `<section class="col"><p class="msg err">${esc(e.message)}</p></section>`; };

async function renderBattle(view) {
  view.innerHTML = `<section class="col" style="max-width:none"><p class="hint">Laden…</p></section>`;
  const uid = state.session.user.id;
  const owned = state.cards
    .filter(c => state.owned.has(c.id))
    .sort((a, b) => (RARITY_ORDER[a.rarity] - RARITY_ORDER[b.rarity]) || (b.attack - a.attack));
  battleState.team = battleState.team.filter(id => state.owned.has(id));

  const [friendRows, battleRows, board] = await Promise.all([
    sb.from('friendships').select('friend_id').eq('user_id', uid),
    sb.from('battles').select('id, challenger_id, opponent_id, status, winner_id, coins_awarded, created_at, resolved_at')
      .or(`challenger_id.eq.${uid},opponent_id.eq.${uid}`).order('created_at', { ascending: false }).limit(40),
    sb.rpc('battle_leaderboard'),
  ]);
  if (friendRows.error) return battleErr(view, friendRows.error);
  // Zonder schema-v6 bestaat de tabel nog niet: dan enkel de oefenmodus tonen
  const online = !battleRows.error;
  const battles = battleRows.data || [];
  const friendIds = (friendRows.data || []).map(r => r.friend_id);
  const ids = [...new Set([...friendIds, ...battles.flatMap(b => [b.challenger_id, b.opponent_id])])].filter(id => id !== uid);
  const names = {};
  if (ids.length) {
    const { data: profs } = await sb.from('profiles').select('id, display_name').in('id', ids);
    for (const p of profs || []) names[p.id] = p.display_name;
  }
  const nameOf = id => names[id] || '…';
  const incoming = battles.filter(b => b.status === 'pending' && b.opponent_id === uid);
  const outgoing = battles.filter(b => b.status === 'pending' && b.challenger_id === uid);
  const done = battles.filter(b => b.status === 'done').slice(0, 10);
  state.incomingBattles = incoming.length;
  syncBattleBadge();

  if (owned.length < TEAM_SIZE) {
    view.innerHTML = `<section class="col soon">
      ${pageHead('Battle', 'battle')}
      <p class="hint">Je hebt minstens ${TEAM_SIZE} verschillende kaarten nodig om te vechten. Je hebt er nu ${owned.length}. Speel nog wat Wordles!</p>
    </section>`;
    return;
  }

  view.innerHTML = `<section class="col" style="max-width:none">
    ${pageHead('Battle', 'battle')}
    ${incoming.length ? `<div class="battle-box highlight">
      <h3>Uitdagingen voor jou (${incoming.length})</h3>
      <p class="hint" style="margin-bottom:6px">Kies hieronder je team en accepteer.</p>
      ${incoming.map(b => `<div class="battle-row">
        <span class="battle-row-text"><strong>${esc(nameOf(b.challenger_id))}</strong> daagt je uit</span>
        <button class="btn small" data-accept-battle="${b.id}" type="button">Accepteren met mijn team</button>
        <button class="link danger" data-decline-battle="${b.id}" type="button">Weigeren</button>
      </div>`).join('')}
      <p class="msg tmsg" id="incomingMsg" role="alert"></p>
    </div>` : ''}

    <div class="battle-bar" style="margin-top:14px">
      <h3 style="margin:0">Jouw team</h3>
      <span id="teamCount" class="pill"></span>
      <button class="link" id="clearTeam" type="button">Team wissen</button>
    </div>
    <div class="battle-pick">${owned.map(c => `
      <button class="pick" type="button" data-pick="${c.id}" aria-pressed="false">
        <span class="pick-num" hidden></span>
        ${renderCard(c)}
      </button>`).join('')}</div>

    <div class="battle-actions">
      <button class="btn small" id="startBattle" type="button">Oefengevecht tegen de computer</button>
      ${online ? (friendIds.length ? `<span class="battle-or">of</span>
        <select id="battleFriend" class="tselect" style="width:auto;min-width:180px">
          <option value="">Kies een vriend…</option>
          ${friendIds.map(id => `<option value="${id}">${esc(nameOf(id))}</option>`).join('')}
        </select>
        <button class="btn small" id="challengeBattle" type="button">Vriend uitdagen</button>`
        : '<span class="hint" style="margin:0">Voeg vrienden toe om ze uit te dagen.</span>') : ''}
    </div>
    <p class="msg tmsg" id="battleMsg" role="alert"></p>

    <div class="three-col">
    ${outgoing.length ? `<div><h3>Openstaande uitdagingen</h3>
      ${outgoing.map(b => `<div class="battle-row">
        <span class="battle-row-text">Wachten op <strong>${esc(nameOf(b.opponent_id))}</strong></span>
        <button class="link danger" data-cancel-battle="${b.id}" type="button">Annuleren</button>
      </div>`).join('')}</div>` : ''}

    ${online ? `<div><h3>Recente gevechten</h3>
      ${done.length ? done.map(b => {
        const won = b.winner_id === uid;
        const other = b.challenger_id === uid ? b.opponent_id : b.challenger_id;
        return `<div class="battle-row">
          <span class="result-tag ${won ? 'won' : 'lost'}">${won ? 'Gewonnen' : 'Verloren'}</span>
          <span class="battle-row-text">tegen <strong>${esc(nameOf(other))}</strong>${won && b.coins_awarded ? ` · +${b.coins_awarded} 🪙` : ''}</span>
          <button class="link" data-replay="${b.id}" type="button">Bekijk gevecht</button>
        </div>`;
      }).join('') : '<p class="hint">Nog geen gevechten tegen vrienden.</p>'}</div>

      <div><h3>Ranglijst</h3>
      ${board.error ? `<p class="msg err">${esc(board.error.message)}</p>` : `<table class="leaderboard">
        <thead><tr><th>#</th><th>Naam</th><th>Gewonnen</th><th>Verloren</th></tr></thead>
        <tbody>${(board.data || []).map((r, i) => `<tr${r.user_id === uid ? ' class="me"' : ''}>
          <td>${i + 1}</td><td>${esc(r.display_name)}</td><td>${r.wins}</td><td>${r.losses}</td></tr>`).join('')}</tbody>
      </table>`}</div>` : ''}
    </div>
  </section>`;

  const teamCards = () => battleState.team.map(id => state.cards.find(c => c.id === id));
  const teamReady = () => battleState.team.length === TEAM_SIZE;
  const sync = () => {
    view.querySelectorAll('[data-pick]').forEach(b => {
      const idx = battleState.team.indexOf(Number(b.dataset.pick));
      b.classList.toggle('selected', idx >= 0);
      b.setAttribute('aria-pressed', idx >= 0);
      const num = b.querySelector('.pick-num');
      num.hidden = idx < 0; num.textContent = idx + 1;
    });
    $('#teamCount').textContent = `Team: ${battleState.team.length}/${TEAM_SIZE}`;
    view.querySelectorAll('#startBattle, #challengeBattle, [data-accept-battle]').forEach(b => { b.disabled = !teamReady(); });
  };
  view.querySelectorAll('[data-pick]').forEach(b => {
    b.onclick = () => {
      const id = Number(b.dataset.pick);
      const idx = battleState.team.indexOf(id);
      if (idx >= 0) battleState.team.splice(idx, 1);
      else if (battleState.team.length < TEAM_SIZE) battleState.team.push(id);
      sync();
    };
  });
  $('#clearTeam').onclick = () => { battleState.team = []; sync(); };

  const practice = mine => {
    const opp = randomOpponent(mine);
    playBattle(view, {
      title: 'Oefengevecht', events: simulateBattle(mine, opp), teams: { A: mine, B: opp }, opponentName: 'Computer',
      again: { label: 'Opnieuw met dit team', run: () => practice(mine) }
    });
  };
  $('#startBattle').onclick = () => practice(teamCards());

  const msg = (id, text, ok) => { const m = $(id); if (m) { m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = text; } };
  if ($('#challengeBattle')) $('#challengeBattle').onclick = async () => {
    const fid = $('#battleFriend').value;
    if (!fid) return msg('#battleMsg', 'Kies eerst een vriend.');
    const { error } = await sb.rpc('create_battle', { p_friend_id: fid, p_cards: battleState.team });
    if (error) return msg('#battleMsg', error.message);
    msg('#battleMsg', `Uitdaging verstuurd naar ${nameOf(fid)}! Je ziet het resultaat zodra die accepteert.`, true);
    setTimeout(() => { if ($('#battleMsg')) renderBattle(view); }, 1200); // niet als er intussen een gevecht speelt
  };
  view.querySelectorAll('[data-cancel-battle]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = await sb.rpc('respond_battle', { p_battle_id: Number(b.dataset.cancelBattle), p_action: 'cancel' });
    if (error) { alert(error.message); b.disabled = false; return; }
    renderBattle(view);
  });
  view.querySelectorAll('[data-decline-battle]').forEach(b => b.onclick = async () => {
    if (!confirm('Deze uitdaging weigeren?')) return;
    b.disabled = true;
    const { error } = await sb.rpc('respond_battle', { p_battle_id: Number(b.dataset.declineBattle), p_action: 'decline' });
    if (error) { alert(error.message); b.disabled = false; return; }
    renderBattle(view);
  });
  view.querySelectorAll('[data-accept-battle]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { data, error } = await sb.rpc('respond_battle', { p_battle_id: Number(b.dataset.acceptBattle), p_action: 'accept', p_cards: battleState.team });
    if (error) { msg('#incomingMsg', error.message); b.disabled = false; return; }
    if (data.status === 'cancelled') { msg('#incomingMsg', 'De uitdager heeft niet meer alle kaarten van zijn team, dus de uitdaging is geannuleerd.'); setTimeout(() => { if ($('#battleMsg')) renderBattle(view); }, 1800); return; }
    replayBattle(view, data);
  });
  view.querySelectorAll('[data-replay]').forEach(b => b.onclick = async () => {
    const { data, error } = await sb.from('battles').select('*').eq('id', Number(b.dataset.replay)).single();
    if (error) { alert(error.message); return; }
    replayBattle(view, data);
  });
  sync();
}

// Een gevecht tegen een vriend afspelen vanuit het opgeslagen verloop
async function replayBattle(view, b) {
  const uid = state.session.user.id;
  const card = id => state.cards.find(c => c.id === id);
  const teams = { A: b.challenger_cards.map(card), B: b.opponent_cards.map(card) };
  const iAmA = b.challenger_id === uid;
  const otherId = iAmA ? b.opponent_id : b.challenger_id;
  const { data: prof } = await sb.from('profiles').select('display_name').eq('id', otherId).maybeSingle();
  const events = fromServerEvents(b.events, teams);
  const won = b.winner_id === uid;
  if (won && b.coins_awarded) {
    // Saldo opnieuw ophalen: de beloning is server-side bijgeschreven
    const { data: w } = await sb.from('user_wallet').select('polycoins').eq('user_id', uid).maybeSingle();
    if (w) { state.wallet = w.polycoins; syncCoinUI(); }
  }
  playBattle(view, {
    title: `Gevecht tegen ${prof?.display_name || 'je vriend'}`,
    events: iAmA ? events : flipEvents(events),
    teams: iAmA ? teams : { A: teams.B, B: teams.A },
    opponentName: prof?.display_name || 'Tegenstander',
    extra: won && b.coins_awarded ? `Je verdiende ${b.coins_awarded} polycoins.` : ''
  });
}

async function playBattle(view, { title, events, teams, opponentName, again, extra = '' }) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let skip = false;

  view.innerHTML = `<section class="col" style="max-width:none">
    <h2>${esc(title)}</h2>
    <div class="battle-layout"><div>
    <div class="arena">
      <div class="fighter" id="fA"><div class="fighter-name">Jij</div><div class="fighter-card"></div><div class="hpbar"><div class="hpfill"></div></div><div class="hptext"></div><div class="bench"></div></div>
      <div class="vs" aria-hidden="true">VS</div>
      <div class="fighter" id="fB"><div class="fighter-name">${esc(opponentName)}</div><div class="fighter-card"></div><div class="hpbar"><div class="hpfill"></div></div><div class="hptext"></div><div class="bench"></div></div>
    </div>
    <div class="battle-bar" style="margin-top:12px">
      <button class="link" id="skipBattle" type="button">Overslaan</button>
    </div>
    </div><div>
    <div id="battleResult"></div>
    <ol class="battle-log" id="battleLog" aria-live="polite"></ol>
    </div></div>
  </section>`;
  $('#skipBattle').onclick = () => { skip = true; };

  const shown = { A: -1, B: -1 };
  const draw = st => {
    for (const side of ['A', 'B']) {
      const el = $(`#f${side}`), s = st[side];
      const f = teams[side][s.active];
      if (shown[side] !== s.active) {
        el.querySelector('.fighter-card').innerHTML = renderCard(f);
        shown[side] = s.active;
        el.classList.remove('ko');
      }
      const hp = s.hps[s.active], max = Number(f.hp) || 50;
      const pct = Math.max(0, hp / max * 100);
      const fill = el.querySelector('.hpfill');
      fill.style.width = pct + '%';
      fill.className = 'hpfill' + (pct <= 25 ? ' low' : pct <= 50 ? ' mid' : '');
      el.querySelector('.hptext').textContent = `HP ${hp} / ${max}`;
      el.querySelector('.bench').innerHTML = s.hps.map((h, i) =>
        `<span class="bench-dot${h === 0 ? ' out' : ''}${i === s.active ? ' now' : ''}" title="${esc(teams[side][i].name)}"></span>`).join('');
    }
  };
  const log = (html, cls = '') => {
    const li = document.createElement('li');
    li.innerHTML = html; if (cls) li.className = cls;
    $('#battleLog').prepend(li);
  };
  const who = side => `<span class="who">${esc(side === 'A' ? 'Jij' : opponentName)}</span>`;

  for (const ev of events) {
    if (!$('#battleLog')) return; // tab gewisseld
    draw(ev.state);
    if (ev.type === 'start') log(`${ev.first === 'A' ? 'Jij begint' : `${esc(opponentName)} begint`}.`);
    if (ev.type === 'attack') {
      const text = ev.kind === 'special'
        ? `★ <strong>${esc(ev.attacker.special_name)}</strong>! ${esc(ev.attacker.name)} doet ${ev.dmg} schade.`
        : `${esc(ev.attacker.name)} raakt ${esc(ev.defender.name)}: ${ev.dmg} schade${ev.kind === 'crit' ? ' — voltreffer!' : ''}.`;
      log(`${who(ev.side)} ${text}`, ev.side === 'A' ? 'mine' : 'theirs');
      if (!skip && !reduce) {
        const target = $(`#f${ev.side === 'A' ? 'B' : 'A'}`);
        const pop = document.createElement('span');
        pop.className = 'dmg-pop' + (ev.kind !== 'hit' ? ' big' : '');
        pop.textContent = `-${ev.dmg}`;
        target.querySelector('.fighter-card').appendChild(pop);
        target.classList.remove('hit'); void target.offsetWidth; target.classList.add('hit');
        setTimeout(() => pop.remove(), 800);
      }
    }
    if (ev.type === 'ko') {
      $(`#f${ev.side}`).classList.add('ko');
      log(`${who(ev.side)} <strong>${esc(ev.card.name)}</strong> is uitgeschakeld!`, 'ko-line');
    }
    if (ev.type === 'enter') log(`${who(ev.side)} ${esc(ev.card.name)} komt de arena in.`);
    if (ev.type === 'end') {
      const won = ev.winner === 'A';
      $('#skipBattle').hidden = true;
      $('#battleResult').innerHTML = `<div class="battle-result ${won ? 'won' : 'lost'}">
        <h3>${won ? 'Gewonnen!' : 'Verloren…'}</h3>
        <p>${won ? `Je team heeft ${esc(opponentName)} verslagen.` : `${esc(opponentName)} was deze keer sterker. Probeer een andere volgorde of andere kaarten.`} ${esc(extra)}</p>
        <div class="battle-bar">
          ${again ? `<button class="btn small" id="againBattle" type="button">${esc(again.label)}</button>` : ''}
          <button class="link" id="backBattle" type="button">Terug naar Battle</button>
        </div>
      </div>`;
      if (again) $('#againBattle').onclick = again.run;
      $('#backBattle').onclick = () => renderBattle(view);
    }
    if (!skip && !reduce) await sleep(ev.type === 'attack' ? 650 : ev.type === 'ko' ? 700 : 450);
  }
}

initBackground();
init();
</script>
