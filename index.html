<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polygon Card Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B2028; --bg2:#232A34; --panel:#262E39; --sleeve:#F4EFE4; --page:#FBF7EE;
  --ink:#F1EFE9; --ink-soft:#B9C2CC; --muted:#8892A0; --line:#3A4453;
  --amber:#E8A33D; --amber-soft:#F4C877;
  --green:#4C8A47; --yellow:#B69B2B; --grey:#6A7482; --gold:#C99A1E; --cat:#2FA79E;
  --facet:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  --facet-sm:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font:400 16px/1.55 var(--body);min-height:100vh;
  background:
    linear-gradient(180deg,rgba(27,32,40,.94),rgba(27,32,40,.98)),
    var(--bg);
  background-attachment:fixed;
  position:relative;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;opacity:.5;pointer-events:none;
  background-image:
    linear-gradient(115deg,transparent 48%,rgba(232,163,61,.05) 49%,rgba(232,163,61,.05) 50%,transparent 51%),
    linear-gradient(25deg,transparent 48%,rgba(255,255,255,.035) 49%,rgba(255,255,255,.035) 50%,transparent 51%);
  background-size:140px 140px,90px 90px;
}
body::after{
  content:"";position:fixed;inset:-10%;z-index:-1;opacity:.6;pointer-events:none;
  background:
    radial-gradient(560px 380px at 12% 8%,rgba(232,163,61,.12),transparent 60%),
    radial-gradient(480px 360px at 88% 88%,rgba(108,75,194,.12),transparent 60%),
    radial-gradient(420px 320px at 90% 12%,rgba(47,167,158,.08),transparent 60%);
  animation:aura-drift 16s ease-in-out infinite alternate;
}
@keyframes aura-drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-2%,2%) scale(1.06)}}
.logo-poly{color:var(--amber-soft);animation:logo-spin 9s linear infinite;flex:none}
@keyframes logo-spin{to{transform:rotate(360deg)}}
.brand{text-shadow:0 0 22px rgba(232,163,61,.3)}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.08;margin:0 0 8px;color:#fff}
h1{font-size:clamp(30px,5vw,46px)}
h2{font-size:clamp(22px,3vw,30px)}
button,input,textarea{font:inherit}
a{color:var(--amber-soft)}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px 56px}
.wrap.wide{max-width:1180px}
.col{max-width:640px}
.hint{color:var(--ink-soft);margin:0 0 20px;max-width:64ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* Knoppen en formulieren */
.btn{background:var(--amber);color:#1B2028;border:0;clip-path:var(--facet-sm);padding:15px 20px;font:700 16px var(--body);min-height:50px;cursor:pointer;width:100%;transition:transform .15s ease, background .15s ease, box-shadow .15s ease}
.btn:hover:not(:disabled){background:var(--amber-soft);transform:translateY(-1px);box-shadow:0 10px 26px -10px rgba(232,163,61,.65)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;padding:10px 6px;font-size:15px}
.link:hover{color:var(--amber-soft)}
.form{display:grid;gap:16px;margin:24px 0 8px}
.form label{display:grid;gap:7px;font-weight:600;font-size:15px;color:var(--ink-soft)}
.form input,.form textarea{border:1px solid var(--line);background:var(--panel);color:var(--ink);clip-path:var(--facet-sm);padding:13px;min-height:50px;font-weight:400;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.5;resize:vertical}
.form input{font-family:var(--body)}
.form input:focus,.form textarea:focus{background:#2C3541}
.msg{margin:0;min-height:1.5em;font-size:15px}
.msg.err,.err{color:#F0897E}
.msg.ok{color:var(--amber-soft)}

/* Wordle-tegels */
.tile{width:clamp(42px,13vw,58px);aspect-ratio:1;display:grid;place-items:center;clip-path:var(--facet-sm);color:#fff;font:800 clamp(22px,7vw,32px)/1 var(--display)}
.t-g{background:var(--green)} .t-y{background:var(--yellow)} .t-x{background:var(--grey)}
.tilerow,.hero{display:flex;gap:6px;justify-content:center}
.hero{margin:20px 0 24px;justify-content:flex-start}
.tile.t-pending{background:var(--grey)}
.tile.flip{animation:flip .55s ease-in-out both;animation-delay:calc(var(--i) * .28s)}
@keyframes flip{
  0%{transform:rotateX(0)}
  49%{transform:rotateX(90deg);background:var(--grey)}
  51%{transform:rotateX(90deg);background:var(--final)}
  100%{transform:rotateX(0);background:var(--final)}
}

/* Kopregel en tabs */
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 18px;gap:12px;flex-wrap:wrap}
.brand{font:800 22px var(--display);color:#fff;display:flex;align-items:baseline;gap:8px}
.brand em{font-style:normal;color:var(--amber-soft)}
.who{display:flex;gap:6px;align-items:center;color:var(--ink-soft);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel);border:1px solid var(--line);clip-path:var(--facet-sm);padding:4px;margin-bottom:26px}
.tabs button{border:0;background:transparent;clip-path:var(--facet-sm);padding:12px;font:700 15px var(--body);color:var(--ink-soft);cursor:pointer;min-height:44px;transition:box-shadow .2s ease}
.tabs button[aria-current="page"]{background:var(--amber);color:#1B2028;box-shadow:0 6px 20px -6px rgba(232,163,61,.65)}
.wrap.wide{position:relative}
.wrap.wide::before,.wrap.wide::after{content:"";position:absolute;top:-6px;width:20px;height:20px;pointer-events:none;opacity:.4}
.wrap.wide::before{left:-6px;border-top:2px solid var(--amber);border-left:2px solid var(--amber)}
.wrap.wide::after{right:-6px;border-top:2px solid var(--amber);border-right:2px solid var(--amber)}
.uphint{font-weight:500;text-transform:none;color:var(--muted);font-size:12.5px}

/* Upload */
.stage{display:grid;justify-items:center;gap:16px;margin-top:24px}
.stage .cw{width:min(280px,72vw)}
.result{margin:0;text-align:center;font-weight:600;color:var(--ink-soft)}
.pop{animation:pop .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

.glow{position:absolute;inset:-30%;border-radius:50%;filter:blur(30px);opacity:0;animation:glow-in .7s ease-out .3s both}
@keyframes glow-in{from{opacity:0;transform:scale(.6)}to{opacity:.55;transform:scale(1)}}
.glow.common{background:radial-gradient(circle,var(--grey),transparent 70%)}
.glow.epic{background:radial-gradient(circle,#8B5CF6,transparent 70%)}
.glow.legendary{background:radial-gradient(circle,var(--gold),transparent 70%)}
.glow.cat{background:radial-gradient(circle,var(--cat),transparent 70%)}

/* Volledig-scherm onthulling bij het trekken van een kaart */
.reveal-overlay{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#050609;opacity:0;pointer-events:none;transition:opacity .3s ease;overflow:hidden}
.reveal-overlay.show{opacity:1;pointer-events:auto}
.reveal-overlay.shake{animation:screen-shake .45s ease}
@keyframes screen-shake{
  0%,100%{transform:translate(0,0)} 20%{transform:translate(-9px,5px)} 40%{transform:translate(8px,-6px)}
  60%{transform:translate(-6px,-4px)} 80%{transform:translate(6px,5px)}
}
.reveal-rays{position:absolute;inset:-60%;opacity:.6;animation:rays-spin 14s linear infinite;
  background:conic-gradient(from 0deg,transparent 0deg,rgba(255,255,255,.06) 6deg,transparent 14deg,transparent 44deg,rgba(255,255,255,.06) 50deg,transparent 58deg,transparent 88deg,rgba(255,255,255,.06) 94deg,transparent 102deg,transparent 132deg,rgba(255,255,255,.06) 138deg,transparent 146deg,transparent 176deg,rgba(255,255,255,.06) 182deg,transparent 190deg,transparent 220deg,rgba(255,255,255,.06) 226deg,transparent 234deg,transparent 264deg,rgba(255,255,255,.06) 270deg,transparent 278deg,transparent 308deg,rgba(255,255,255,.06) 314deg,transparent 322deg,transparent 352deg,rgba(255,255,255,.06) 358deg,transparent 360deg)}
@keyframes rays-spin{to{transform:rotate(360deg)}}
.reveal-vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(0,0,0,.8) 100%)}
.reveal-flash{position:absolute;inset:0;opacity:0;pointer-events:none}
.reveal-flash.pop{animation:flash-pop .55s ease-out}
@keyframes flash-pop{0%{opacity:0}14%{opacity:.95}100%{opacity:0}}
.reveal-flash.common{background:radial-gradient(circle,#fff,var(--grey))}
.reveal-flash.epic{background:radial-gradient(circle,#fff,#8B5CF6)}
.reveal-flash.legendary{background:radial-gradient(circle,#fff,var(--gold))}
.reveal-flash.cat{background:radial-gradient(circle,#fff,var(--cat))}
.reveal-stage{position:relative;display:grid;place-items:center;width:min(320px,82vw)}
.reveal-glow{position:absolute;inset:-45%;border-radius:50%;filter:blur(44px);opacity:0;animation:glow-in .6s ease-out .8s both}
.pack{position:relative;width:min(190px,55vw);aspect-ratio:5/7;display:grid;place-items:center;animation:pack-float 2.2s ease-in-out infinite}
.pack.burst{animation:pack-burst .5s cubic-bezier(.3,.9,.4,1) both}
@keyframes pack-float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
@keyframes pack-burst{to{transform:scale(1.6);opacity:0}}
.pack-shell{position:absolute;inset:0;clip-path:var(--facet);background:linear-gradient(155deg,var(--panel),var(--bg2) 60%,#131820);border:2px solid var(--amber-soft);display:grid;place-items:center;box-shadow:0 0 44px -6px rgba(232,163,61,.55)}
.pack-shell::before{content:"?";font:800 22cqw var(--display);color:rgba(232,163,61,.55)}
.reveal-card{opacity:0;width:min(230px,68vw)}
.reveal-card.in{animation:card-slam .7s cubic-bezier(.2,1.4,.3,1) both}
@keyframes card-slam{
  0%{opacity:0;transform:scale(.2) rotateY(180deg) rotate(-10deg)}
  60%{opacity:1;transform:scale(1.08) rotateY(0deg) rotate(2deg)}
  100%{opacity:1;transform:scale(1) rotateY(0deg) rotate(0deg)}
}
.confetti{position:absolute;left:50%;top:50%;width:9px;height:9px;clip-path:var(--facet-sm);opacity:0;pointer-events:none;animation:confetti-burst 1.1s ease-out both;animation-delay:var(--d,0s)}
@keyframes confetti-burst{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}
  100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r))}
}
.particle{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:var(--amber-soft);opacity:0;pointer-events:none;animation:particle-float linear infinite;animation-delay:var(--d,0s);animation-duration:var(--dur,3s)}
@keyframes particle-float{
  0%{opacity:0;transform:translate(-50%,-50%)}
  10%{opacity:.85}
  90%{opacity:.4}
  100%{opacity:0;transform:translate(calc(-50% + var(--ex)),calc(-50% + var(--ey)))}
}
.reveal-label{margin-top:20px;text-align:center;opacity:0}
.reveal-label.in{animation:pop .5s cubic-bezier(.2,1.2,.4,1) both}
.reveal-label .rar{font:800 16px var(--display);letter-spacing:.06em;text-transform:uppercase}
.reveal-label .rar.common{color:var(--ink-soft)}
.reveal-label .rar.epic{color:#B9A2F0}
.reveal-label .rar.legendary{color:var(--gold)}
.reveal-label .rar.cat{color:var(--cat)}
.reveal-label p{margin:5px 0 0;color:var(--ink-soft);font-size:14.5px}
.reveal-skip{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--amber);color:#1B2028;border:0;clip-path:var(--facet-sm);padding:13px 28px;font:700 15px var(--body);cursor:pointer;opacity:0;pointer-events:none}
.reveal-skip.in{opacity:1;pointer-events:auto;transition:opacity .3s ease .2s}
.reveal-skip:hover{background:var(--amber-soft)}
@media (max-width:480px){.reveal-stage{width:min(280px,86vw)}}

/* Kaarten (schalen mee met hun breedte) */
.cw{container-type:inline-size;width:100%;position:relative}
.card{position:relative;aspect-ratio:5/7;clip-path:var(--facet);padding:5.5cqw;display:flex;flex-direction:column;gap:3cqw;border:1.6cqw solid var(--rc);background:var(--rbg);color:#241C0F;overflow:hidden;font-size:8cqw;text-align:left}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:2cqw;font:800 9cqw/1.05 var(--display)}
.cname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp{font:700 7cqw var(--body);white-space:nowrap}
.art{flex:1;min-height:0;clip-path:var(--facet-sm);background:var(--art);display:grid;place-items:center;overflow:hidden;border:.8cqw solid rgba(0,0,0,.15)}
.art img{width:100%;height:100%;object-fit:cover}
.ptile{width:38cqw;aspect-ratio:1;clip-path:var(--facet-sm);display:grid;place-items:center;background:rgba(0,0,0,.22);color:#fff;font:800 22cqw/1 var(--display)}
.ptile.cat{background:transparent;font-size:28cqw}
.cfoot{display:flex;justify-content:space-between;font:700 7cqw var(--body)}
.special{font:600 7cqw/1.15 var(--body);border-top:.8cqw solid rgba(0,0,0,.2);padding-top:2cqw}
.special small{display:none;font-weight:400}
@container (min-width:180px){.special small{display:block;margin-top:1cqw}}
.r-common{--rc:#8A98A1;--rbg:linear-gradient(165deg,#fff,#E7ECEF);--art:#DDE4E8}
.r-epic{--rc:#6C4BC2;--rbg:linear-gradient(140deg,#F3EEFF,#D5C7F7 45%,#F3EEFF 60%,#C4B0F2);--art:linear-gradient(135deg,#B9A2F0,#7F5FD0)}
.r-legendary{--rc:#B98910;--rbg:linear-gradient(140deg,#FFF6D6,#F1CF6A 45%,#FFF1BE 60%,#E2B83E);--art:linear-gradient(135deg,#F5D97A,#C99A1E)}
.r-legendary::after{content:"";position:absolute;inset:-50%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-60%);animation:shine 5s ease-in-out infinite;pointer-events:none}
.r-epic::after{content:"";position:absolute;inset:-50%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.32) 50%,transparent 58%);transform:translateX(-60%);animation:shine 6.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.r-cat{--rc:#1F8F8A;--rbg:linear-gradient(165deg,#EAFBF9,#C9EEEA);--art:#A9DDD8}
.locked{filter:saturate(.15) brightness(.85)}
.q{font:800 30cqw/1 var(--display);color:rgba(0,0,0,.28)}
.dupe{position:absolute;right:-6px;top:-8px;background:var(--amber);color:#1B2028;clip-path:var(--facet-sm);padding:2px 9px;font:700 12px var(--body);z-index:2}

/* Boek */
.book{background:linear-gradient(160deg,#3B2E20,#241A10);clip-path:var(--facet);padding:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.spread{background:var(--page);clip-path:var(--facet-sm);padding:0;display:grid;grid-template-columns:260px 1fr;min-height:520px;position:relative;color:#241C0F}
.spread::before{content:"";position:absolute;left:260px;top:0;bottom:0;width:20px;margin-left:-10px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.15),transparent);pointer-events:none}
.index-page{padding:26px 20px;border-right:1px solid rgba(0,0,0,.1);overflow-y:auto}
.index-page h3{color:#241C0F;font-size:18px;margin-bottom:4px}
.index-page .sub{color:#6B5E4C;font-size:13px;margin-bottom:18px}
.index-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.index-list button{width:100%;text-align:left;background:none;border:0;padding:10px 10px;cursor:pointer;color:#241C0F;border-radius:0;display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 14.5px var(--body)}
.index-list button:hover{background:rgba(0,0,0,.05)}
.index-list button[aria-current="page"]{background:var(--amber);color:#1B2028}
.index-list .frac{font:600 12.5px var(--body);color:#8A7A63;font-variant-numeric:tabular-nums}
.index-list button[aria-current="page"] .frac{color:#1B2028;opacity:.75}
.page-body{padding:26px 26px 20px;display:flex;flex-direction:column}
.page-body .pname{font-size:22px;margin-bottom:2px}
.page-body .pcount{color:#6B5E4C;font-size:14px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1;align-content:start}
.slot{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;display:block;transition:transform .15s ease}
.slot:hover{transform:translateY(-3px)}
div.slot{cursor:default}
.pageturn{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid rgba(0,0,0,.1)}
.pageturn button{background:none;border:1px solid rgba(36,28,15,.25);clip-path:var(--facet-sm);padding:9px 16px;font:700 14px var(--body);cursor:pointer;color:#241C0F}
.pageturn button:disabled{opacity:.3;cursor:default}
.pageturn .pnum{font:600 13.5px var(--body);color:#8A7A63;font-variant-numeric:tabular-nums}
.page-body.turning{animation:pageturn .38s ease}
@keyframes pageturn{0%{opacity:0;transform:perspective(800px) rotateY(-8deg)}100%{opacity:1;transform:none}}

dialog{border:0;padding:0;background:transparent;max-width:none;overflow:visible}
dialog::backdrop{background:rgba(10,12,16,.75)}
.zoombox{width:min(320px,86vw);padding:16px;display:grid;gap:10px;justify-items:center}
.zoombox .cw{width:100%}
.zoombox .link{color:#fff}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}

@media (max-width:760px){
  .spread{grid-template-columns:1fr}
  .spread::before{display:none}
  .index-page{border-right:0;border-bottom:1px solid rgba(0,0,0,.1);max-height:220px}
}
@media (prefers-reduced-motion:reduce){
  .r-legendary::after,.r-epic::after,.pop,.tile.flip,.glow,.page-body.turning,
  body::after,.logo-poly,.reveal-rays,.pack,.reveal-overlay.shake,.reveal-flash.pop,
  .reveal-card.in,.reveal-label.in,.confetti,.particle,.reveal-glow{animation:none}
}
</style>
</head>
<body>
<div id="app"><p class="loading">Laden…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ---------------------------------------------------------------
// Vul hier de gegevens van je Supabase-project in
// (Project Settings > API). De anon key mag publiek staan.
// ---------------------------------------------------------------
const CONFIG = {
  SUPABASE_URL: 'https://rmgnkwlmgtfamhioncny.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtZ25rd2xtZ3RmYW1oaW9uY255Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNTM3MTMsImV4cCI6MjEwNTYyOTcxM30.rGXsDOX0Bd42qmnXh3VQm2WyQHPymmdSywnFDNOVnUg'
};

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const $ = (sel, el = document) => el.querySelector(sel);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const RARITY_LABEL = { common: 'Common', epic: 'Epic', legendary: 'Legendary', cat: 'Troostkat' };
const TILE_COLORS = { g: 'var(--green)', y: 'var(--yellow)', x: 'var(--grey)' };
const REVEAL_PATTERN = {
  common: ['g','x','x','x','x'],
  epic: ['g','g','g','x','x'],
  legendary: ['g','g','g','g','g'],
  cat: ['y','y','y','y','y']
};

const state = { session: null, cards: [], owned: new Map(), play: null, name: '', tab: 'today', page: 0 };

const todayBrussels = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Brussels' });
const tiles = (word, cls) => [...word].map((ch, i) => `<span class="tile t-${cls[i]}">${ch}</span>`).join('');
const plural = n => n === 1 ? 'poging' : 'pogingen';

// ---------- Opstart en routing ----------
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  sb.auth.onAuthStateChange((_event, s) => {
    const changed = s?.user?.id !== state.session?.user?.id;
    state.session = s;
    if (changed) route();
  });
  route();
}

async function route() {
  if (!state.session) { renderAuth('login'); return; }
  app.innerHTML = '<p class="loading">Laden…</p>';
  try {
    await loadData();
    renderMain();
  } catch (e) {
    app.innerHTML = `<main class="wrap"><p role="alert" class="err">${esc(e.message)}</p><button class="btn" id="out">Uitloggen</button></main>`;
    $('#out').onclick = () => sb.auth.signOut();
  }
}

async function loadData() {
  const uid = state.session.user.id;
  const [cards, mine, play, prof] = await Promise.all([
    sb.from('cards').select('*').order('id'),
    sb.from('user_cards').select('card_id').eq('user_id', uid),
    sb.from('daily_plays').select('*').eq('user_id', uid).eq('play_date', todayBrussels()).maybeSingle(),
    sb.from('profiles').select('display_name').eq('id', uid).maybeSingle()
  ]);
  for (const r of [cards, mine, play, prof]) if (r.error) throw new Error(r.error.message);
  state.cards = cards.data;
  state.owned = new Map();
  for (const row of mine.data) state.owned.set(row.card_id, (state.owned.get(row.card_id) || 0) + 1);
  state.play = play.data;
  state.name = prof.data?.display_name || state.session.user.email.split('@')[0];
}

// ---------- Inloggen ----------
function renderAuth(mode) {
  const reg = mode === 'register';
  app.innerHTML = `
  <main class="wrap">
    <div class="hero" aria-hidden="true">${tiles('POLY', ['g','y','x','g'])}</div>
    <h1>Polygon <em>Card Collection</em></h1>
    <p class="hint">Los de dagelijkse Wordle op, plak je resultaat en verzamel facetkaarten van je collega's.</p>
    <form id="authform" class="form">
      ${reg ? '<label>Naam<input name="name" required autocomplete="nickname" maxlength="30"></label>' : ''}
      <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
      <label>Wachtwoord<input name="password" type="password" required minlength="6" autocomplete="${reg ? 'new-password' : 'current-password'}"></label>
      <button class="btn" type="submit">${reg ? 'Account maken' : 'Inloggen'}</button>
      <p id="authmsg" role="alert" class="msg"></p>
    </form>
    <button class="link" id="switch">${reg ? 'Ik heb al een account' : 'Nog geen account? Maak er een'}</button>
  </main>`;
  $('#switch').onclick = () => renderAuth(reg ? 'login' : 'register');
  $('#authform').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const msg = $('#authmsg');
    const btn = e.target.querySelector('button[type=submit]');
    msg.textContent = ''; msg.className = 'msg'; btn.disabled = true;
    try {
      if (reg) {
        const { data, error } = await sb.auth.signUp({
          email: f.get('email'), password: f.get('password'),
          options: { data: { display_name: f.get('name') } }
        });
        if (error) throw error;
        if (!data.session) {
          msg.textContent = 'Account gemaakt. Bevestig je e-mailadres via de mail die we stuurden en log daarna in.';
          msg.className = 'msg ok';
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
        if (error) throw error;
      }
    } catch (err) {
      msg.textContent = err.message; msg.className = 'msg err';
    } finally {
      btn.disabled = false;
    }
  };
}

// ---------- Kaart tekenen ----------
function renderCard(c, { locked = false, count = 1 } = {}) {
  const label = RARITY_LABEL[c.rarity];
  if (locked) {
    return `<div class="cw"><div class="card r-${c.rarity} locked" aria-label="Nog niet verzameld">
      <div class="chead"><span class="cname">???</span></div>
      <div class="art"><span class="q">?</span></div>
      <div class="cfoot"><span>${label}</span></div></div></div>`;
  }
  const initial = esc((c.person || '?').trim().charAt(0).toUpperCase());
  const art = c.image_url
    ? `<img src="${esc(c.image_url)}" alt="${esc(c.name)}" loading="lazy">`
    : (c.rarity === 'cat' ? '<span class="ptile cat">🐱</span>' : `<span class="ptile">${initial}</span>`);
  const special = c.special_name
    ? `<div class="special">★ ${esc(c.special_name)}${c.special_power ? ` (${esc(c.special_power)})` : ''}<small>${esc(c.special_desc)}</small></div>`
    : '';
  return `<div class="cw">
    ${count > 1 ? `<span class="dupe">×${count}</span>` : ''}
    <div class="card r-${c.rarity}">
      <div class="chead"><span class="cname">${esc(c.name)}</span><span class="hp">HP ${esc(c.hp)}</span></div>
      <div class="art">${art}</div>
      <div class="cfoot"><span>${label}</span><span>ATK ${esc(c.attack)} / DEF ${esc(c.defense)}</span></div>
      ${special}
    </div></div>`;
}

// ---------- Hoofdscherm ----------
function renderMain() {
  app.innerHTML = `
  <div class="wrap wide" id="wrap">
    <header class="top">
      <span class="brand"><svg class="logo-poly" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><polygon points="12,2 22,8.5 19,20 5,20 2,8.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>POLYGON <em>Card Collection</em></span>
      <span class="who">${esc(state.name)} <button class="link" id="logout">Uitloggen</button></span>
    </header>
    <nav class="tabs" aria-label="Weergave">
      <button data-tab="today">Vandaag</button>
      <button data-tab="book">Mijn boek</button>
    </nav>
    <div id="view"></div>
  </div>
  <dialog id="zoom" aria-label="Kaart bekijken">
    <div class="zoombox"><div id="zcard"></div><button class="link" id="zclose">Sluiten</button></div>
  </dialog>`;
  $('#logout').onclick = () => sb.auth.signOut();
  document.querySelectorAll('.tabs button').forEach(b => {
    b.onclick = () => { state.tab = b.dataset.tab; renderMain(); };
  });
  const dlg = $('#zoom');
  $('#zclose').onclick = () => dlg.close();
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  renderView();
}

function renderView() {
  document.querySelectorAll('.tabs button').forEach(b => {
    if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  const view = $('#view');
  if (state.tab === 'today') renderToday(view); else renderBook(view);
}

// ---------- Tab: Vandaag ----------
function playSummary(play) {
  return play.solved
    ? `Opgelost in ${play.attempts} ${plural(play.attempts)}.`
    : 'Niet opgelost vandaag. Je kreeg een troostkat.';
}

function renderToday(view) {
  if (state.play) {
    const card = state.cards.find(c => c.id === state.play.card_id);
    view.innerHTML = `<section class="col">
      <h2>Vandaag is gedaan</h2>
      <p class="hint">${playSummary(state.play)} Morgen kan je opnieuw een kaart trekken.</p>
      <div class="stage">${card ? renderCard(card) : ''}</div></section>`;
    return;
  }
  view.innerHTML = `<section class="col">
    <h2>Wordle van vandaag</h2>
    <p class="hint">Klik in Discord op <strong>Share</strong> bij je afgewerkte Wordle en plak het resultaat hieronder. Vul ook het woord in dat je geraden hebt — zo weten we zeker dat je de Wordle echt gespeeld en opgelost hebt. Je trekt één kaart per dag, en hoe minder pogingen, hoe zeldzamer je kaart.</p>
    <div id="uploadbox" class="form">
      <label for="sharetext">Wordle-resultaat<textarea id="sharetext" rows="7" placeholder="Plak hier je gedeelde Wordle-resultaat"></textarea></label>
      <label for="word">Het geraden woord <span class="uphint">(in HOOFDLETTERS)</span><input id="word" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase"></label>
      <button class="btn" id="go" disabled>Kaart trekken</button>
      <p id="msg" role="alert" class="msg"></p>
    </div>
    <div class="stage" id="stage" aria-live="polite"></div>
  </section>`;
  const checkReady = () => {
    $('#go').disabled = $('#sharetext').value.trim().length < 10 || $('#word').value.trim().length !== 5;
    $('#msg').textContent = '';
  };
  $('#sharetext').oninput = checkReady;
  $('#word').oninput = checkReady;
  $('#go').onclick = async () => {
    const msg = $('#msg'), go = $('#go');
    go.disabled = true; msg.className = 'msg'; msg.textContent = 'Resultaat controleren…';
    try {
      const text = $('#sharetext').value;
      const word = $('#word').value;
      const { data, error } = await sb.functions.invoke('submit-wordle', { body: { text, word } });
      if (error) {
        let errText = 'Er ging iets mis. Probeer het opnieuw.';
        try { errText = (await error.context.json()).error || errText; } catch (_) {}
        throw new Error(errText);
      }
      state.play = { solved: data.solved, attempts: data.attempts, card_id: data.card.id, play_date: todayBrussels() };
      state.owned.set(data.card.id, (state.owned.get(data.card.id) || 0) + 1);
      $('#uploadbox').hidden = true;
      await revealCard(data);
    } catch (err) {
      msg.className = 'msg err'; msg.textContent = err.message; go.disabled = false;
    }
  };
}

function spawnParticles(container, n) {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    const angle = Math.random() * Math.PI * 2;
    const dist = 70 + Math.random() * 160;
    p.style.setProperty('--ex', `${Math.cos(angle) * dist}px`);
    p.style.setProperty('--ey', `${Math.sin(angle) * dist}px`);
    p.style.setProperty('--d', `${Math.random() * 2.2}s`);
    p.style.setProperty('--dur', `${2.4 + Math.random() * 2.2}s`);
    frag.appendChild(p);
  }
  container.appendChild(frag);
}

function spawnConfetti(container, n) {
  const colors = ['var(--amber)', 'var(--amber-soft)', '#8B5CF6', 'var(--gold)', '#fff'];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    const angle = Math.random() * Math.PI * 2;
    const dist = 90 + Math.random() * 180;
    c.style.setProperty('--x', `${Math.cos(angle) * dist}px`);
    c.style.setProperty('--y', `${Math.sin(angle) * dist}px`);
    c.style.setProperty('--r', `${Math.random() * 720 - 360}deg`);
    c.style.setProperty('--d', `${Math.random() * .35}s`);
    c.style.background = colors[i % colors.length];
    frag.appendChild(c);
  }
  container.appendChild(frag);
}

async function revealCard(res) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rarity = res.rarity;
  const stageText = res.solved
    ? `Opgelost in ${res.attempts} ${plural(res.attempts)}. Je trok een ${RARITY_LABEL[rarity]}-kaart.`
    : 'Niet opgelost vandaag. Je kreeg een troostkat.';

  const overlay = document.createElement('div');
  overlay.className = 'reveal-overlay';
  overlay.innerHTML = `
    <div class="reveal-vignette"></div>
    <div class="reveal-flash ${rarity}" id="rvFlash"></div>
    <div class="reveal-rays" id="rvRays"></div>
    <div class="reveal-stage">
      <div class="reveal-glow ${rarity}"></div>
      <div id="rvParticles"></div>
      <div id="rvConfetti"></div>
      <div class="pack" id="rvPack"><div class="pack-shell"></div></div>
      <div class="reveal-card" id="rvCard">${renderCard(res.card)}</div>
      <div class="reveal-label" id="rvLabel">
        <span class="rar ${rarity}">${RARITY_LABEL[rarity]}</span>
        <p>${res.solved ? `Opgelost in ${res.attempts} ${plural(res.attempts)}.` : 'Niet opgelost vandaag.'}</p>
      </div>
    </div>
    <button class="reveal-skip" id="rvSkip">Verder →</button>`;
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => overlay.classList.add('show'));

  const finish = () => {
    overlay.classList.remove('show');
    document.body.style.overflow = '';
    setTimeout(() => overlay.remove(), 300);
  };
  // Het resultaat staat ook meteen achter de overlay klaar in de pagina zelf.
  $('#stage').innerHTML = `<div class="pop">${renderCard(res.card)}</div><p class="result">${stageText}</p>`;

  if (reduce) {
    $('#rvPack', overlay).hidden = true;
    $('#rvRays', overlay).remove();
    $('#rvCard', overlay).classList.add('in');
    $('#rvLabel', overlay).classList.add('in');
    $('#rvSkip', overlay).classList.add('in');
    return new Promise(resolve => { $('#rvSkip', overlay).onclick = () => { finish(); resolve(); }; });
  }

  spawnParticles($('#rvParticles', overlay), 18);
  await sleep(1400);
  $('#rvPack', overlay).classList.add('burst');
  $('#rvFlash', overlay).classList.add('pop');
  overlay.classList.add('shake');
  await sleep(140);
  $('#rvCard', overlay).classList.add('in');
  if (rarity === 'epic' || rarity === 'legendary') {
    spawnConfetti($('#rvConfetti', overlay), rarity === 'legendary' ? 28 : 16);
  }
  await sleep(650);
  $('#rvLabel', overlay).classList.add('in');
  $('#rvSkip', overlay).classList.add('in');

  return new Promise(resolve => {
    $('#rvSkip', overlay).onclick = () => { finish(); resolve(); };
    overlay.addEventListener('click', e => { if (e.target === overlay) { finish(); resolve(); } });
  });
}

// ---------- Tab: Mijn boek ----------
function bookGroups() {
  const groups = [];
  for (const c of state.cards) {
    let g = groups.find(x => x.name === c.person);
    if (!g) { g = { name: c.person, cards: [] }; groups.push(g); }
    g.cards.push(c);
  }
  for (const g of groups) g.cards.sort((a, b) => a.slot - b.slot);
  return groups;
}
const ownedIn = g => g.cards.filter(c => state.owned.has(c.id)).length;

function renderBook(view) {
  const groups = bookGroups();
  if (!groups.length) { view.innerHTML = '<p class="hint">Er zijn nog geen kaarten in de database.</p>'; return; }
  if (state.page >= groups.length) state.page = 0;
  drawBook(view, groups, false);
}

function drawBook(view, groups, animate) {
  const g = groups[state.page];
  const people = groups.filter(x => x.name !== 'Katten');
  const total = people.reduce((n, x) => n + x.cards.length, 0);
  const have = people.reduce((n, x) => n + ownedIn(x), 0);
  const dupes = [...state.owned.values()].reduce((n, v) => n + (v - 1), 0);

  view.innerHTML = `<div class="book"><div class="spread">
    <nav class="index-page" aria-label="Collega's">
      <h3>Verzamelboek</h3>
      <p class="sub">${have}/${total} kaarten${dupes ? ` · ${dupes} dubbel` : ''}</p>
      <ul class="index-list">${groups.map((x, i) =>
        `<li><button data-i="${i}" aria-current="${i === state.page}">${esc(x.name)}<span class="frac">${ownedIn(x)}/${x.cards.length}</span></button></li>`).join('')}</ul>
    </nav>
    <div class="page-body${animate ? ' turning' : ''}">
      <h3 class="pname">${esc(g.name)}</h3>
      <p class="pcount">${ownedIn(g)} van ${g.cards.length} verzameld</p>
      <div class="grid">${g.cards.map(c => {
        const n = state.owned.get(c.id) || 0;
        return n
          ? `<button class="slot" data-id="${c.id}" aria-label="${esc(c.name)} bekijken">${renderCard(c, { count: n })}</button>`
          : `<div class="slot">${renderCard(c, { locked: true })}</div>`;
      }).join('')}</div>
      <div class="pageturn">
        <button id="prevp" ${state.page === 0 ? 'disabled' : ''}>← Vorige</button>
        <span class="pnum">${state.page + 1} / ${groups.length}</span>
        <button id="nextp" ${state.page === groups.length - 1 ? 'disabled' : ''}>Volgende →</button>
      </div>
    </div>
  </div></div>`;

  view.querySelectorAll('.index-list button').forEach(b => {
    b.onclick = () => { state.page = Number(b.dataset.i); drawBook(view, groups, true); };
  });
  $('#prevp', view).onclick = () => { state.page = Math.max(0, state.page - 1); drawBook(view, groups, true); };
  $('#nextp', view).onclick = () => { state.page = Math.min(groups.length - 1, state.page + 1); drawBook(view, groups, true); };
  view.querySelectorAll('button.slot').forEach(b => {
    b.onclick = () => {
      const card = state.cards.find(c => c.id === Number(b.dataset.id));
      $('#zcard').innerHTML = renderCard(card, { count: state.owned.get(card.id) || 1 });
      $('#zoom').showModal();
    };
  });
}

init();
</script>
